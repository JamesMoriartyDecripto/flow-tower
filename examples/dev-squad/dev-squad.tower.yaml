# yaml-language-server: $schema=../../schema/flow-tower.schema.json
# Canonical Dev Squad (#355): one engine, the Node runner in tools/squad, on one OpenRouter key.
# The lead is the user's own session in any skill-capable harness; no SDK, no Claude account.
# squad init installs this tower as tools/squad/squad.tower.yaml with its bundle under tools/squad/dev-squad/.
# The role node ids below are the ones tools/squad/roles.mjs posts live events to: keep them stable.
version: 1
name: Dev Squad
tags: [coding, openrouter, multi-agent, harness-agnostic]
limits: { concurrency: 2, description: "The lead decides what runs at once. Reviewer and security start together (both read-only); coder steps run one at a time per worktree." }
description: >-
  A coding squad that works your GitHub issues on one OpenRouter key. Your current session
  (Claude Code, Codex, Pi, Hermes, Cursor…) is the lead: it plans, writes the task files and
  verifies. Specialists (triage, architect, researcher, coder, tester, doc writer, reviewer,
  security, verifier) run through the Node runner in tools/squad, each on the model its
  squad.json names. A maintainer merges.

runtimes:
  laptop:
    kind: local
    label: "Your machine"
    description: "The lead session, the runner scripts (Node 22, git) and the worktrees. Nothing is deployed."
  github:
    kind: saas
    label: "GitHub"
    description: "Issues, pull requests and CI."
    provider: "github"
    url: "https://github.com/example-org/app"
  openrouter:
    kind: saas
    label: "OpenRouter"
    description: "One OpenAI-style API, one key, every model family: each specialist role runs here."
    provider: "openrouter"
    url: "https://openrouter.ai"

prompts:
  task-template:
    file: task-template.md
    description: "The shape of one step: rules, files to read, why, numbered items, the Files: line the runner checks."

agents:
  lead:
    runtime: laptop
    name: Lead (your session)
    description: "Your own coding agent, in any harness that loads skills. It follows the flow-tower-squad skill: issue, tower, plan, task files, runs the specialists, verifies everything itself, opens the PR. It never merges."
    model: your-harness-model
    harness: { provider: any, skill: flow-tower-squad }
    files: [README.md]
    meta: { pattern: orchestrator-workers }
  triage:
    runtime: laptop
    name: Triage
    description: "Read-only classifier: route full / needs_info / reject and the areas touched."
    model: anthropic/claude-haiku-5.5
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true }
    files: [roles/triage.md]
    meta: { pattern: routing }
  architect:
    runtime: laptop
    name: Architect
    description: "Read-only planner: criteria, open questions, ordered steps with their Files: lines. With the design skill it names the data shape first, compares two shapes and keeps the one where each piece of state has one owner, and cuts vertical steps: one behaviour and its test each (#457). A step lists the files it edits and, apart, existing files it only reads; criteria say what the finished change does, never the runner's own work (review, PR, records) (#462)."
    model: openai/gpt-6.1-terra
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true }
    files: [roles/architect.md]
    meta: { default_model: openai/gpt-6.1-terra, why: "default in squad.json since #320: 9/9 plans at 1.8 cents in the #362 benchmark" }
  lead-judge:
    runtime: laptop
    name: Lead judge
    description: "#320. Read-only: keeps or drops each review finding with a reason, as the lead does by hand today. Kept findings become one fix step that carries each keep reason, so a conditional fix is read the way the judge meant it (#462)."
    model: google/gemini-4-carbon
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true }
    files: [roles/lead-judge.md]
    meta: { why: "18/18 keep/drop decisions on real review findings in the #447 benchmark (Sonnet 5.5: 15/18, one critical finding dropped), about 5 cents per round" }
  researcher:
    runtime: laptop
    name: Researcher
    description: "Read-only: answers the plan's open questions with file:line citations. Pinned to its own model since #447: it no longer follows the reviewer's."
    model: z-ai/glm-5.3-flash
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true }
    files: [roles/researcher.md]
  coder:
    runtime: laptop
    name: Coder
    description: "Implements one step in a tool loop with the minimum the task needs, writes only the step's folders, runs the checks, ends with Known gaps."
    model: anthropic/claude-haiku-5.5
    tower: towers/runner-loop.tower.yaml
    harness: { provider: openrouter, runner: steps.sh, mode: loop, max_steps: 70 }
    sandbox: { network: open, filesystem: workspace }
    files: [roles/coder.md, task-template.md]
  tester:
    runtime: laptop
    name: Tester
    description: "Runs the project's existing checks and reports; writes nothing."
    model: anthropic/claude-haiku-5.5
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true }
    files: [roles/tester.md]
  doc-writer:
    runtime: laptop
    name: Doc writer
    description: "Writes only the doc folders given with --write: CHANGELOG, README, docs."
    model: anthropic/claude-haiku-5.5
    harness: { provider: openrouter, runner: run.mjs, mode: loop }
    files: [roles/doc-writer.md]
  reviewer:
    runtime: laptop
    name: Reviewer
    description: "One packed request, JSON verdict only: changes only when a finding is critical or high. Another model family than the coder's. Flags bugs and unneeded complexity: code the brief does not ask for, duplicates, oversized solutions."
    model: minimax/minimax-m3.1-flash
    harness: { provider: openrouter, runner: run.mjs, mode: oneshot, read_only: true }
    files: [roles/reviewer.md]
    meta: { pattern: evaluator-optimizer, role: evaluator, cross_model: "MiniMax reviews Haiku's code", why: "#447, four real pull requests at their real size: saw 7 of 12 kept defects (GLM 5.3 Flash: 4) and raised no critical or high finding on a clean head" }
  security:
    runtime: laptop
    name: Security auditor
    description: "One packed request, JSON verdict with severities: changes only when a finding is critical or high. Names the existing guard before proposing a new check. Same model as the reviewer since #447. In the PR steward an empty, cut or no-verdict answer gets one more try, and the fallback to the reviewer's model runs only when it is another model (#456); a failed attempt's stderr is printed. The manual pack and run path has no retry."
    model: minimax/minimax-m3.1-flash
    harness: { provider: openrouter, runner: run.mjs, mode: oneshot, read_only: true }
    files: [roles/security.md]
  verifier:
    runtime: laptop
    name: Verifier
    description: "Fresh context: the criteria and the branch, PASS or HOLD per criterion with evidence. Pinned to its own model since #447: it no longer follows the reviewer's."
    model: z-ai/glm-5.3-flash
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true, context: fresh }
    files: [roles/verifier.md]

layers:
  # 1 ───────────────────────────────────────────────────────────────
  - id: intake
    title: Intake & Triage
    description: "You pick the issue and ask your session to work it with the squad. Triage proposes a route; the lead decides."
    nodes:
      - id: issue
        runtime: github
        type: entry
        label: GitHub issue
        description: "The live record: the plan, each step's status, review findings kept or dropped and why, the squad cost when it closes."
        files: [README.md]
      - id: lead
        agent: lead
        label: Lead
      - id: triage
        agent: triage
        label: Triage
      - id: route
        runtime: laptop
        type: decision
        label: Route?
        description: "Triage proposes, the lead decides. Every change takes the full path (a trivial one gets a one-step plan); a sensitive area named in the title, body or areas needs the maintainer's plan sign-off."
        decision: { output: choice, candidates: [full, needs_info, reject], fail: closed }
        files: [roles/triage.md]
      - id: needs_info
        runtime: github
        type: output
        label: Ask reporter
        description: "needs_info: the lead comments the questions; reject: the reason. No branch is created."
        files: [roles/triage.md]
    edges:
      - "issue -> lead: work #n with the squad"
      - "lead -> triage [spawn]: issue text as data"
      - "triage -> route [data]: route, areas"
      - { from: route, to: needs_info, label: unclear, condition: "route in [needs_info, reject]" }

  # 2 ───────────────────────────────────────────────────────────────
  - id: orchestration
    title: Plan & Steps
    description: "Towers before code: the lead updates the tower of the part it changes, then plans and writes one task file per step."
    nodes:
      - id: branch
        runtime: laptop
        label: Feature branch
        description: "One branch per issue from an up-to-date main, in the existing checkout (or an authorized worktree). Never main."
        files: [README.md]
      - id: architect
        agent: architect
        label: Architect
      - id: tower
        runtime: laptop
        label: Tower first
        description: "The tower that models the changed part gets the planned design, validated 0 errors / 0 warnings and committed before any code."
        files: [README.md]
      - id: signoff
        runtime: github
        type: human
        label: Plan sign-off
        description: "For a sensitive area or a large plan, the maintainer approves or revises the plan on the issue before any step runs."
        approval: { by: maintainer, via: issue comment, actions: [approve, edit, respond], when: "sensitive area or many steps" }
        files: [README.md]
      - id: tasks
        runtime: laptop
        label: Task files
        description: "tools/squad/tasks/<n>/NN-*.md, one or two items each: files to read, why with file:line, numbered changes, tests, and the Files: line the runner checks."
        prompt: task-template
        files: [task-template.md]
    edges:
      - "branch -> architect [spawn]: issue, tower"
      - "architect -> tower [data]: design"
      - { from: tower, to: signoff, kind: handoff, label: sensitive }
      - { from: tower, to: tasks, label: otherwise }
      - "signoff -> tasks: approved"
      - "signoff -> architect [return]: revise"

  # 3 ───────────────────────────────────────────────────────────────
  - id: specialists
    title: Specialists
    description: "Each role is one run.mjs process on its own OpenRouter model, with only the tools its role allows."
    nodes:
      - id: researcher
        agent: researcher
        label: Researcher
      - id: coder
        agent: coder
        label: Coder
      - id: tester
        agent: tester
        label: Tester
      - id: green
        runtime: laptop
        type: decision
        label: Step green?
        description: "steps.sh: the coder run finished, the project's check passes, every Files: entry was touched. Otherwise the step is RED and the chain stops."
        decision: { output: binary, candidates: [green, red], fail: closed }
        files: [roles/coder.md]
      - id: commit
        runtime: laptop
        label: Step commit
        description: "Only the step's own files, signed off, with a Squad-Cost trailer. Local edits from before the run are never staged; a rerun skips committed steps."
        files: [roles/coder.md]
      - id: doc_writer
        agent: doc-writer
        label: Doc writer
    edges:
      - "researcher -> coder [data]: cited answers"
      - "coder -> green [data]: report, Known gaps"
      - "green -> commit: green"
      - "green -> coder [return]: red, lead rewrites the step"
      - "commit -> tester [handoff]: branch"
      - "tester -> doc_writer: checks pass"

  # 4 ───────────────────────────────────────────────────────────────
  - id: quality
    title: Quality Gate
    description: "Reviewer and security answer in one request each with the code packed, started together. The merge gate reads their findings; the maintainer merges."
    nodes:
      - id: pack
        runtime: laptop
        label: Pack
        description: "pack.mjs: role rules, the brief (what is already decided), the diff from the merge base of the base and the head (a base that moved on is not shown as reverted, #452; when git cannot find one, the pack stops with git's own reason) and the changed files, in one prompt; it records the merge base, and the reviewed commit when the tree is clean (the gate refuses a review without it)."
        files: [roles/reviewer.md]
      - id: reviewer
        agent: reviewer
        label: Reviewer
      - id: security
        agent: security
        label: Security auditor
      - id: triage_findings
        runtime: laptop
        type: decision
        label: Findings real?
        description: "The lead checks each finding in the code or by running it; keeps the real ones as new steps, drops the rest with the reason on the issue."
        decision: { output: binary, candidates: [fix, drop], fail: closed }
        files: [README.md]
      - id: verifier
        agent: verifier
        label: Verifier
      - id: tower_check
        runtime: laptop
        type: decision
        label: Tower matches?
        description: "After the code lands and again after each fix round, so the last check comes right before the gate, the lead compares the tower with the code line by line: every edge and description proven by a file:line, every exit drawn. A fresh read-only reviewer does it above about 40 nodes. Drift goes back to the tower, validated and audited again (#457)."
        decision: { output: binary, candidates: [matches, drift], fail: closed }
        files: [README.md]
      - id: gate
        runtime: laptop
        type: decision
        label: Merge gate
        description: "gate.mjs: CI reported and green (skipping counts), not a draft, mergeable, the worktree clean and at the PR head, reviewer and security packed from that head with no critical, high or unknown-severity finding, and no changes verdict without one. READY or NOT READY with the reasons, and a note when a pass saw a pack trimmed to fit (#422)."
        meta: { severity: "Reviewer and security findings carry one scale (critical, high, medium, low); the gate blocks on a critical or high finding, verified or not, and on one with no known severity, so a low note never fails it. Since #449 the pack tells both passes to answer changes only for a critical or high finding, after which 31 of 31 verdicts matched the severities. A changes verdict with no such finding breaks that rule, so the gate refuses it as a malformed answer with its own reason (check the findings, run the pass again), as it does an unknown severity; an answer without approve or changes is refused too. An outside gate keys on the same two (#427)." }
        decision: { output: binary, candidates: [ready, not_ready], fail: closed }
        files: [roles/reviewer.md, roles/security.md]
      - id: merge
        runtime: github
        type: human
        label: Maintainer merge
        description: "Only the maintainer merges. Agents never run the merge."
        approval: { by: maintainer, via: PR, actions: [approve, respond] }
    edges:
      - "pack -> reviewer [spawn]: packed review"
      - "pack -> security [spawn]: packed audit"
      - "reviewer -> triage_findings [return]: verdict JSON"
      - "security -> triage_findings [return]: verdict JSON"
      - "triage_findings -> verifier: nothing left to fix"
      - "verifier -> tower_check: PASS"
      - "tower_check -> gate: matches"
      - "gate -> merge: READY"

  # 5 ───────────────────────────────────────────────────────────────
  - id: runner
    title: Runner (tools/squad)
    description: "Node scripts with no dependency beyond Node 22 and git. Installed into the project by squad init; the same files in every harness."
    nodes:
      - id: run
        runtime: laptop
        type: process
        label: run.mjs
        description: "One role, one process: picks the model from squad.json, the mode (tool loop for most roles, oneshot or batch for reviewer and security), calls OpenRouter, records the cost."
        meta: { empty_answer: "An empty oneshot answer prints finish_reason, tokens (prompt, completion, reasoning) and the generation id, and is recorded at its real cost, null when unknown, never 0. An empty answer cut at the output budget is retried once with a doubled budget (#412).", logs: "Each run writes its role log to squad-logs/ beside the cost ledger (so it follows SQUAD_LEDGER and FLOW_TOWER_HOME), or to SQUAD_LOGS, never beside the runner, in a folder created private to its user (0700; an existing folder, such as one named by SQUAD_LOGS, keeps its mode), and keeps the newest 200 or those under 14 days: 2154 logs (116 MB) there slowed every test that copies tools/squad (#453).", trimmed: "The trimmed-pack note counts only a cut marker alone on its line, not one inside a packed file (#422)." }
        tower: towers/runner-loop.tower.yaml
        files: [towers/runner-loop.tower.yaml, roles/coder.md]
      - id: steps
        runtime: laptop
        type: process
        label: steps.sh
        description: "Runs the coder on each task file in order; check, Files: check and one commit per green step. Runs from a copy of itself; REPO and the task folder are made absolute first, so relative ones work (#394). Every file of the folder is a coder step: tasks of other roles live in their own folder."
        meta: { portability: "Runs on macOS bash 3.2 and passes paths as :(literal), so project hooks keep their globs (#396, #403).", probe_sweep: "The sweep of coder probe files never touches the task folder (#420).", adopt: "Local edits are kept out of squad commits; SQUAD_ADOPT=<paths> lets the lead hand a red step's leftovers to the step that continues it, and a literal Files: entry kept out turns the step RED before the coder runs (#416). Undo first the part of the leftovers that made the step red: the next run builds on what is adopted (#462)." }
        files: [roles/coder.md]
      - id: guard
        runtime: laptop
        type: guard
        label: Write fence
        description: "Writes only inside the role's folders, real paths checked, symlinks followed; secrets and paths outside the repo refused. Children run without the API key."
        files: [roles/coder.md]
      - id: gate_script
        runtime: laptop
        type: process
        label: gate.mjs
        description: "Reads the findings of the two answers and the PR state; the reviewed commit must be the PR head."
        files: [roles/reviewer.md]
      - id: steward
        runtime: laptop
        type: process
        label: PR steward
        description: "prs.mjs: reviews and gates every open PR from the trusted checkout, one row per PR. Each pass gets a second try on an empty, cut or no-verdict answer; security falls back to the reviewer's model only when it differs (#456). Its runs light quality.reviewer and quality.security (#458)."
        files: [README.md]
    edges:
      - "steps -> run [spawn]: coder, one step"
      - "run -> guard [call]: every write"
      - "steward -> run [spawn]: reviewer, security"
      - "steward -> gate_script [call]: per PR"

  # 6 ───────────────────────────────────────────────────────────────
  - id: setup
    title: Setup & Config
    description: "Three commands and one key. No account other than OpenRouter's."
    nodes:
      - id: init
        runtime: laptop
        type: entry
        label: squad init
        description: "Copies the runner into tools/squad/, detects squad.json (check command, write and review folders), installs this tower and ignores the logs."
        files: [README.md]
      - id: key
        runtime: laptop
        type: memory
        label: OpenRouter key
        description: "flow-tower squad key stores it in the user folder (~/.config/flow-tower/.env, mode 600), never in the project. OPENROUTER_API_KEY in the environment wins."
        files: [README.md]
      - id: config
        runtime: laptop
        type: memory
        label: squad.json
        description: "Per project: check/test commands, write and review folders, the diff base, project rules and the model of each role. The runner runs commands without a shell, so a command with shell syntax is refused when loaded."
        meta: { style: "style.language and style.maxFileLines (default English, 400) feed every prompt and task rule line, so project rules never contradict them (#404)." }
        files: [squad.example.json]
      - id: skills
        runtime: laptop
        type: memory
        label: Project skills
        description: "tools/squad/skills/<name>.md: project know-how only some jobs need (a shell version, a test convention). squad.json skills gives a role its skills; a task's Skills: line adds them for one run. Inlined into the system prompt by name only, size-capped, secret names refused; none set, prompts unchanged (#432)."
        meta: { standards: "This repo gives code-standards to the coder and the reviewer on every run, so code is written and judged by the same rules (a review finding cites the rule); tests is added by the Skills: line of a step that writes a test, and the autopilot planner adds it itself when a step's Files: names a test; design goes to the architect. The lead keeps them: a rule comes from the principles the maintainer works by or from a real failure, named by issue, and leaves once a check enforces it (#457)." }
        files: [README.md]
      - id: doctor
        runtime: laptop
        type: guard
        label: squad doctor
        description: "Checks git, Node, the config, the runner files, the key and that the check command can start (its program on PATH; a python -m module is found with find_spec, never imported), with no paid call and no code of the repo run (#405)."
        files: [README.md]
      - id: skill
        runtime: laptop
        type: memory
        label: Squad skill
        description: "install-skill --target claude|codex|pi|hermes|cursor|agents: the lead's procedure, the same in every harness."
        files: [README.md]
    edges:
      - "init -> config [data]: detected"
      - "key -> doctor [data]: present?"
      - "config -> doctor [data]: valid?"
      - "config -> skills [data]: per role"
      - "skills -> doctor [data]: exist?"

  # 7 ───────────────────────────────────────────────────────────────
  - id: observe
    title: Cost & Live View
    description: "Every run that gets past its setup leaves a ledger line; the tower lights up while a role runs."
    nodes:
      - id: ledger
        runtime: laptop
        type: memory
        label: Cost ledger
        description: "One line per run in the user folder: role, model, steps, tokens, the cost OpenRouter reports. cost.mjs sums an issue."
        files: [README.md]
      - id: live
        runtime: laptop
        type: output
        label: Live tower
        description: "ev.sh posts start/end events to a running flow-tower viewer: the role's node lights up. Best effort: offline it is skipped. Test runs point FLOW_TOWER_URL at a closed port, so they never light it (#462)."
        files: [README.md]

  # 8 ───────────────────────────────────────────────────────────────
  - id: models
    title: Models (OpenRouter)
    description: "One key, any family. The defaults come from the squad's own benchmarks; squad.json overrides any role."
    nodes:
      - id: openrouter
        runtime: openrouter
        type: model
        label: OpenRouter
        description: "One OpenAI-style endpoint. Reviewer, security, architect, lead-judge, researcher and verifier have their own default; triage, tester and doc writer use the coder's. A models entry in squad.json replaces a default. Before #447, researcher and verifier followed the reviewer's model."
        files: [squad.example.json]
      - id: haiku
        runtime: openrouter
        type: model
        label: Claude Haiku 5.5
        model: anthropic/claude-haiku-5.5
        description: "Default coder (and triage, tester, doc writer by family)."
        files: [squad.example.json]
      - id: minimax
        runtime: openrouter
        type: model
        label: MiniMax M3.1 Flash
        model: minimax/minimax-m3.1-flash
        description: "Default reviewer and security auditor since #447. Another family than the coder's."
        files: [squad.example.json]
      - id: glm
        runtime: openrouter
        type: model
        label: GLM 5.3 Flash
        model: z-ai/glm-5.3-flash
        description: "Default researcher and verifier. It was the reviewer until #447, which measured it approving 11 of 12 clean heads and asking for changes on 1 of 12 defective ones."
        files: [squad.example.json]
      - id: carbon
        runtime: openrouter
        type: model
        label: Gemini 4 Carbon
        model: google/gemini-4-carbon
        description: "Default lead-judge of the unattended runner since #447."
        files: [squad.example.json]
    edges:
      - "openrouter -> haiku [call]: write"
      - "openrouter -> minimax [call]: review and audit"
      - "openrouter -> glm [call]: research and verify"
      - "openrouter -> carbon [call]: keep or drop"

  # 9 ───────────────────────────────────────────────────────────────
  - id: autopilot
    title: Unattended Runner
    description: "#320: tools/squad/runner.mjs works labelled issues with no person in a session. The procedure lives in code; models make only the judgement calls. One issue at a time, on this laptop first, polling GitHub."
    nodes:
      - id: poll
        runtime: laptop
        type: entry
        label: Poll squad:go
        description: "Every 10 minutes (--once for one pass) it lists open issues labelled squad:go, oldest first."
        files: [README.md]
      - id: claim
        runtime: github
        label: Claim
        description: "Swaps squad:go for squad:running, so two runners never take the same issue."
        files: [README.md]
      - id: driver
        runtime: laptop
        type: process
        label: runner.mjs
        description: "The code-driven lead: triage, worktree under the user folder, plan as task files, steps.sh, review and security, lead-judge, at most 2 fix rounds (findings still open after them go into the draft PR; a security one not clearly medium or low stops), verifier, draft PR, gate. A failed check stops the issue. Issue and plan reach models fenced as data; anything posted is scrubbed of keys and tokens."
        files: [README.md]
        meta: { setup: "After worktree add, commands.setup from the trusted checkout's squad.json (npm ci here) runs once in the worktree without the model key; a failure stops the issue before any plan. A worktree starts with no dependencies, so without it the first check fails (#462).", answers: "An answer is the first json object block that validates (an echoed template or a quoted draft never wins), read from the role report without run.mjs header lines; an unreadable triage answer is asked for once more. The plan sign-off is released for one issue by a person with SQUAD_APPROVE=<issue number>, which posts an approval comment on the issue. (#369)", plan_files: "A plan file entry is one path: a comma or a line break is refused, since the Files line splits there and a second path would skip the control-file sign-off; a glob entry needs the sign-off when a control path starts with its text before the first * (tools/*/x, **/x, *.json) (#391); so does a literal entry whose folder holds a control path, since the coder may write that whole folder (tools/helper.mjs grants tools/) (#435). A step's optional reads (existing paths: no + mark, nothing outside the repo) go on its Read line, never on Files, and the plan sign-off does not look at them, since a read changes nothing (#462)." }
      - id: judge
        agent: lead-judge
        label: Lead judge
        description: "Keeps or drops findings against the original issue and plan. A kept fix may name up to 5 supporting files it must edit; every Files path must be a concrete regular file outside secret paths, and CI or runner files need a person."
      - id: limits
        runtime: laptop
        type: guard
        label: Limits
        description: "From squad.json: issues in parallel (1), a dollar cap per issue summed from the ledger, a wall-clock timeout. Over a limit, the issue stops. A lock in the user folder allows one runner, and --issue n needs the squad:go label."
        limits: { concurrency: 1 }
        files: [squad.example.json]
      - id: draft_pr
        runtime: github
        type: output
        label: Draft PR
        description: "Stop point: a draft PR with the plan, the dropped findings with reasons and the spend, then the gate result commented on the issue, whose label becomes squad:review. The maintainer merges."
        files: [README.md]
      - id: failed
        runtime: github
        type: output
        label: squad:failed
        description: "Red chain, over budget, timeout or no verdict: a comment with the reason, label squad:failed, the worktree kept for inspection."
        files: [README.md]
    edges:
      - "poll -> claim: oldest issue"
      - "claim -> driver [handoff]: issue"
      - "driver -> limits [call]: before each stage"
      - "driver -> judge [spawn]: findings"
      - "judge -> driver [return]: keep or drop + reason"
      - "driver -> draft_pr: gate result"
      - "driver -> failed: stop"
      - "limits -> failed: over a limit"

