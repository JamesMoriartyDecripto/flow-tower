# Commercialista AI: levers catalogue, tax year 2026 (Italy)
# Research date: 2026-10-15. Check status before every memo.
# Sources: research/levers-2026.md; sites-it.md sections 2-4, 6, 7 for startup, PV, employer and forfettario facts.
# Confidence is mapped from the notes: H = high, M = medium, L = low, UNVERIFIED = unverified.
# Where the notes give M-H, the lower level (medium) is used.
# Expired, closed and not-passed levers are kept on purpose: the scanner uses them to say "no longer available".
# Figures, dates and article numbers are copied from the notes. Nothing here has been checked on the live text.
# Profile keys: srl, startup, startup-innovativa, fotovoltaico, employer, forfettario (see profiles.yaml).

levers:
  - id: iperammortamento_2026
    name: "Iperammortamento 2026-2028 (Nuovo Piano Transizione 5.0)"
