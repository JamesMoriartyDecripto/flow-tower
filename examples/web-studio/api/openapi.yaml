# The contract between the frontend and backend lanes. Content (products, posts, faqs)
# is read through the Payload Local API and generated types; only custom endpoints live here.
openapi: 3.1.0
info: { title: Nordlicht web API, version: 1.3.0 }
servers:
  - url: https://nordlicht-coffee.example/api
  - url: https://{preview}.vercel.app/api
    variables: { preview: { default: nordlicht-git-main } }
paths:
  /checkout:
    post:
      summary: Create a Stripe Checkout Session for the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, locale]
              properties:
                items:
                  type: array
                  minItems: 1
                  items: { type: object, required: [productId, quantity], properties: { productId: { type: string }, quantity: { type: integer, minimum: 1, maximum: 20 } } }
                subscription: { type: boolean, default: false }
                locale: { type: string, enum: [en, da, de] }
      responses:
        "200": { description: Session created, content: { application/json: { schema: { type: object, properties: { url: { type: string, format: uri } } } } } }
        "422": { description: Unknown product or out of stock }
  /enquiries:
    post:
      summary: Wholesale or contact enquiry (Turnstile-protected, emails the team via Resend)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name, email, message, turnstileToken]
              properties:
                kind: { type: string, enum: [contact, wholesale] }
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                company: { type: string, maxLength: 160 }
                message: { type: string, maxLength: 4000 }
                turnstileToken: { type: string }
      responses:
        "201": { description: Stored and notified }
        "400": { description: Validation failed }
        "429": { description: Rate limited }
  /stripe/webhook:
    post:
      summary: Stripe events (signature-verified, idempotent by event id)
      responses:
        "200": { description: Processed or already processed }
        "400": { description: Bad signature }
