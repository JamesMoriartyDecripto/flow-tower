description: |
  Leafwise recuerda cuándo necesita agua cada una de tus plantas.

  - Recordatorios según la estación: en invierno se riega menos y las macetas grandes, con menos frecuencia.
  - Widget para la pantalla de inicio: las plantas de hoy, marcadas con un toque.
  - Un diario con fotos para cada planta.
  - Funciona sin conexión y sincroniza después.

  Leafwise Premium desbloquea la identificación de plantas y plantas ilimitadas. Plan anual con 7 días de prueba gratis o mensual. El pago se carga en tu cuenta de la tienda; la suscripción se renueva automáticamente salvo que la canceles al menos 24 horas antes del final del periodo.

  Privacidad: no te rastreamos entre apps y webs, y puedes eliminar tu cuenta desde la app.
