# yaml-language-server: $schema=../../../schema/flow-tower.schema.json
version: 1
name: Frontend lane internals
description: >-
  How the frontend lead builds one page template in Claude Code: read the Figma frame and
  Code Connect map, build or reuse components in packages/ui, assemble the page as a React
  Server Component with the typed client, and self-check against Figma and axe before the PR.
root: ..
tags: [frontend, nextjs, figma-mcp, code-connect, playwright]

runtimes:
  laptop:
    kind: local
    label: Lead dev workstation
    description: Claude Code session with the client repo, .mcp.json and CLAUDE.md.
  figma:
    kind: saas
    label: Figma (remote MCP)
    provider: figma
    url: https://mcp.figma.com/mcp
  vercel-fn:
    kind: serverless
    label: Vercel Functions
    provider: vercel
    region: fra1
  vercel-edge:
    kind: edge
    label: Vercel Edge
    provider: vercel
  visitor:
    kind: browser
    label: Visitor browser
  headless:
    kind: browser
    label: Headless Chromium (Playwright MCP)

agents:
  fe:
    name: Frontend lead
    model: claude-opus-5-5
    prompt: { file: prompts/frontend-lead.md }
    tools: [Read, Edit, Write, Bash, mcp__figma__get_design_context, mcp__figma__get_screenshot, mcp__figma__get_code_connect_map]
    runtime: laptop
    sandbox: { network: allowlist, allow: [registry.npmjs.org, mcp.figma.com, api.github.com, "*.vercel.app"], filesystem: workspace }

layers:
  - id: inputs
    title: Inputs
    description: Everything the lane builds from is generated or signed off; nothing is copied by eye.
    nodes:
      - id: frame
        type: entry
        label: Template frame
        description: Linear issue with the signed Figma frame link (desktop, tablet, mobile) for one page template.
        runtime: laptop
      - id: design_ctx
        type: tool
        label: get_design_context
        description: Structured design context (defaults to React + Tailwind) plus get_screenshot of the frame as the visual reference.
        runtime: figma
        credentials: user
      - id: code_connect
        type: memory
        label: Code Connect map
        description: Figma component -> packages/ui component. Reuse beats regeneration.
        runtime: figma
      - id: client
        type: memory
        label: Typed client
        description: packages/api-client (openapi-fetch types) and payload-types.ts. Regenerated by the backend lane.
        runtime: laptop
        files: [scripts/gen-api-client.sh, api/openapi.yaml]
    edges:
      - { from: frame, to: design_ctx, kind: call, label: node id, protocol: mcp }
      - { from: design_ctx, to: code_connect, kind: data, label: mapped components }

  - id: components
    title: Components
    description: Missing components are built once in packages/ui and mapped back to Figma.
    nodes:
      - id: exists
        type: decision
        label: Component exists?
        runtime: laptop
      - id: build
        agent: fe
        label: Build component
        description: Accessible markup first (native elements, labels, focus styles), tokens only, variants from Figma properties.
        files: [design/tokens.json, scripts/figma-tokens.ts]
      - id: story
        label: Story + test
        description: Storybook story per variant with an interaction test (keyboard and pointer).
        runtime: laptop
      - id: map
        type: tool
        label: Code Connect map
        description: add_code_connect_map. Maps the new component back to its Figma node so designers and future pages reuse it.
        runtime: figma
    edges:
      - "exists -> build: no"
      - build -> story
      - { from: story, to: map, kind: call, protocol: mcp }

  - id: page
    title: Page assembly
    description: Where each piece runs is explicit. HTML from the server, minimal JavaScript in the browser, routing at the edge.
    nodes:
      - id: rsc
        agent: fe
        label: Page (RSC)
        description: Server Component fetching content via the Payload Local API; generateMetadata and JSON-LD from the CMS fields.
        fanout: { min: 1, max: 3, by: locales }
      - id: server
        label: Server render
        description: ISR for products and journal (revalidate on Payload afterChange hook), static for content pages.
        runtime: vercel-fn
      - id: island
        label: Client island
        description: "'use client' only where needed: cart, menu, enquiry form calling /api/enquiries through the typed client."
        runtime: visitor
      - id: edge
        label: Middleware
        description: Locale negotiation and legacy Shopify redirects.
        runtime: vercel-edge
    edges:
      - "rsc -> server: deploy"
      - "server -> island: hydrate"
      - "edge -> server: rewrite"

  - id: check
    title: Self-check & PR
    description: The lead compares its work with the signed design before anyone else does. Three rounds, then the issue is escalated.
    nodes:
      - id: compare
        type: tool
        label: Compare vs Figma
        description: Playwright MCP screenshots at 390 and 1440 px of the local build, compared with get_screenshot of the frame.
        runtime: headless
        limits: { ttl: 20m }
      - id: axe
        label: axe quick check
        description: browser_evaluate with axe-core on the local page; the full suite runs later on the preview.
        runtime: headless
        files: [qa/a11y.spec.ts]
      - id: ok
        type: decision
        label: Matches?
        runtime: laptop
        limits: { max_iterations: 3 }
      - id: pr
        type: output
        label: Pull request
        description: PR with Figma link, screenshots and the Vercel preview URL; triggers the integration gates.
        runtime: laptop
    edges:
      - compare -> ok
      - axe -> ok
      - "ok -> pr: yes"

links:
  - "inputs.code_connect -> components.exists [data]"
  - "components.exists -> page.rsc: yes"
  - "components.map -> page.rsc: component ready"
  - "inputs.client -> page.rsc [data]: types"
  - "page.server -> check.compare: local build"
  - "page.server -> check.axe"
  - "check.ok -> page.rsc [return]: no, max 3"
