# yaml-language-server: $schema=../../../schema/flow-tower.schema.json
version: 1
name: Playtest bot
description: >-
  One bot run, two levels below the studio. A deterministic policy handles movement; the Haiku
  model only picks the next goal every few seconds, so a 20-minute run costs cents.
root: ..

runtimes:
  gpu-cloud:
    kind: cloud
    label: "GPU playtest fleet"
    description: "Spot g5.xlarge fleet running headless builds with bot clients. Scales to zero between runs."
    host: "forge-playtest-spot"
    provider: "aws"
    region: "eu-central-1"
  anthropic:
    kind: saas
    label: "Claude API"
    description: "Opus, Sonnet and Haiku 5.5 plus server-side web search."
    provider: "anthropic"
    url: "https://console.anthropic.com"

prompts:
  playtest-bot: { file: prompts/playtest-bot.md }

agents:
  bot:
    runtime: gpu-cloud
    name: Playtest bot
    model: claude-haiku-5-5
    prompt: playtest-bot
    tools: [mcp__forge__run_playtest]
    harness: { max_turns: 60, decision_interval_s: 5 }
    budget: { usd: 0.3, on_exceed: stop }

layers:
  - id: boot
    title: Boot
    description: Headless client with the bot plugin, fixed seed and persona.
    nodes:
      - id: persona
        runtime: gpu-cloud
        type: entry
        label: Persona + seed
        description: "Example: explorer on seed 0x5EED0042, objective rekindle 3 beacons."
        files: [memory/playtest-insights.md]
      - id: launch
        runtime: gpu-cloud
        type: tool
        label: run_playtest
        description: -nullrhi -nosound -ExecCmds="Bot.Start persona", telemetry over a local socket.
        tools: [mcp__forge__run_playtest]
        files: [src/tools/run-playtest.ts]
      - id: observe
        runtime: gpu-cloud
        label: Observe state
        description: Compact JSON snapshot - position, health, inventory, visible POIs, current quest.
    edges:
      - "persona -> launch [call]: args"
      - "launch -> observe [data]: snapshot"

  - id: loop
    title: Act Loop
    description: Policy moves, the model chooses goals. Stuck detection forces a new goal or a report.
    nodes:
      - id: decide
        agent: bot
        label: Choose goal
      - id: policy
        runtime: gpu-cloud
        resources:
          - { kind: script, label: "bot_policy.py", path: "pipelines/playtest/bot_policy.py" }
        label: Bot policy
        description: Navmesh pathing, combat micro and interaction from the persona weights.
        files: [pipelines/playtest/bot_policy.py]
      - id: act
        runtime: gpu-cloud
        label: Send inputs
        description: Input events at 30 Hz through the bot plugin.
      - id: stuck
        runtime: gpu-cloud
        type: decision
        label: Stuck > 30s?
        description: No progress toward goal for 30 s, or position delta under 1 m for 10 s.
      - id: haiku
        runtime: anthropic
        type: model
        label: Haiku 5.5
        model: claude-haiku-5-5
        description: Goal selection every 5 s from the snapshot. Never controls raw inputs.
    edges:
      - "decide -> policy [data]: goal"
      - "decide -> haiku [call]: snapshot"
      - "policy -> act [call]: path"
      - "act -> stuck"
      - "stuck -> decide [return]: re-plan"

  - id: report
    title: Report
    description: Everything the triage agent needs to reproduce, nothing it does not.
    nodes:
      - id: stream
        runtime: gpu-cloud
        resources:
          - { kind: log, label: "Fleet log", path: "logs/playtest-fleet.log" }
        type: memory
        label: Telemetry stream
        description: NDJSON events - deaths, crafts, beacons, frame times, errors.
        files: [src/telemetry/aggregate.ts]
      - id: crash
        runtime: gpu-cloud
        resources:
          - { kind: dashboard, label: "Crash reports", url: "https://sentry.forge.example.com/organizations/forge/issues/?project=emberwake" }
        type: output
        label: Crash report
        description: Minidump, last 200 log lines and the input trace for replay.
      - id: run_report
        runtime: gpu-cloud
        type: output
        label: Run report
        description: Objective result, stuck points, frustration notes from the persona's point of view.
    edges:
      - "stream -> run_report [data]: summary"
      - "stream -> crash [data]: on crash"

links:
  - "boot.observe -> loop.decide [data]: state"
  - "loop.act -> report.stream [data]: events"
  - "loop.stuck -> report.run_report: objective done"
