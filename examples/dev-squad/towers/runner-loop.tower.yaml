# yaml-language-server: $schema=../../../schema/flow-tower.schema.json
version: 1
name: Runner loop
description: >-
  What one run.mjs process does for a role: read the config and the key, build the prompt,
  call OpenRouter in a tool loop (or once, for a packed review), fence every write, and end
  with a report, a verdict or a failed run.
root: ..

runtimes:
  laptop:
    kind: local
    label: "Your machine"
    description: "The runner process, the repository and its checks."
  openrouter:
    kind: saas
    label: "OpenRouter"
    description: "Chat completions with tool calls; the cost of each generation."
    provider: "openrouter"
    url: "https://openrouter.ai"

layers:
  - id: start
    title: Start
    description: "Everything that can fail cheaply fails before the first paid request."
    nodes:
      - id: args
        runtime: laptop
        type: entry
        label: Role and task
        description: "--role (one of ten), --task file, --issue, --write, --base, --model, --steps and a mode flag. An unknown role, a doc writer without --write or a bad folder is refused before the key is read."
        meta: { refusals: "Exit 1 with no request and no ledger line: no --task or a missing file; a bare --base, one that is an option, not an ancestor of HEAD or HEAD itself; an unknown role; a bare --model or no model for the role; a missing or refused skill; a --steps that is not a whole number of at least 1. A bad --write, or a doc writer without one, exits 2." }
        files: [roles/coder.md]
      - id: config
        runtime: laptop
        type: memory
        label: squad.json
        description: "The repo's commands, folders, base, rules and the role's model (its own, else its family's), read from --repo. A bad file exits 1 before anything runs."
        files: [squad.example.json]
      - id: key
        runtime: laptop
        type: memory
        label: Key
        description: "OPENROUTER_API_KEY from the environment, else the user folder's .env, else the repo's git-ignored .env, else the main checkout's (a worktree has none). Never passed to child commands."
        files: [README.md]
      - id: mode
        runtime: laptop
        type: decision
        label: Mode?
        description: "Reviewer and security: oneshot by default; batch with --batch or SQUAD_PACE=overnight, which falls back to oneshot at full price when the model has no batch endpoint; --loop keeps the tools. Every other role: the tool loop. Checked before the key: --oneshot or --batch on another role, two mode flags or a bad SQUAD_PACE exit 1."
        decision: { output: choice, candidates: [loop, oneshot, batch], fail: closed }
        files: [roles/reviewer.md]
    edges:
      - "args -> config: repo"
      - "config -> key: ready"
      - "key -> mode: role"

  - id: loop
    title: Tool loop
    description: "The model asks for tools; the runner executes them inside the fence and answers. A step cap ends runaway loops."
    nodes:
      - id: call
        runtime: openrouter
        type: model
        label: Model call
        description: "One chat completion with the role's tools, 3 minutes per call: no answer is asked once more, then the run crashes. An HTTP error ends the run. A reply with no tool call gets a nudge (use the tools, finish when done) and spends a step."
        limits: { timeout: 3m, retries: 1 }
        files: [squad.example.json]
      - id: tools
        runtime: laptop
        type: tool
        label: Tools
        description: "list_files, read_file, grep for every role; edit_file, write_file, delete_file only for writers; run for the project's whitelisted commands (check, typecheck, lint, test <file>, diff, status, and validate or dryrun when squad.json extras list them); finish."
        meta: { diff: "diff is taken from the merge base of squad.json base, or of a per-run --base <rev> (a stacked branch reviews only its own commits), with HEAD, so a base that moved on is not shown as reverted (#452), and starts with git log --oneline base..HEAD so a read-only role can confirm the commits (#425).", grep: "The pattern goes to git grep with -e, so a leading dash is a pattern, not an option; no match is git exit 1, any other failure is shown as an error (#424).", verdict: "A reviewer or security finish with no JSON verdict (--loop) is refused and asked for once more; a second one ends the run as no-verdict." }
        tools: [list_files, read_file, grep, edit_file, write_file, delete_file, run, finish]
        files: [roles/coder.md]
      - id: fence
        runtime: laptop
        type: guard
        label: Write fence
        description: "Real path inside the role's folders, never a secret file; write_file refuses probe names (tmp-, zz-, probe, scratch); reads are checked on their real path too, so a link cannot reach a secret. Commands run without the API key."
        files: [roles/coder.md]
      - id: cap
        runtime: laptop
        type: decision
        label: Steps left?
        description: "--steps, 40 by default; steps.sh gives the coder 70. Two calls before the cap, the model is told to finish. At the cap the run exits nonzero; its last text is a diagnostic on stderr, never a verdict."
        decision: { output: binary, candidates: [continue, stop], fail: closed }
        limits: { max_iterations: 40 }
        files: [roles/coder.md]
    edges:
      - "call -> tools [call]: tool calls"
      - "call -> cap [return]: no tool call, nudge"
      - "tools -> fence [call]: writes, commands"
      - "fence -> cap [return]: results"
      - "cap -> call: continue"

  - id: end
    title: End
    description: "A loop role is complete only when it calls finish; a one-request role when its answer holds the verdict."
    nodes:
      - id: oneshot
        runtime: openrouter
        type: model
        label: One request
        description: "Reviewer and security: one completion with no tools and a 10 minute cap (a timeout is a crash), or one batch request. An empty oneshot answer cut at the output budget is retried once with double the budget. A cut answer (finish_reason other than stop) or one with no JSON verdict fails the run."
        limits: { timeout: 10m, retries: 1 }
        files: [roles/reviewer.md]
      - id: report
        runtime: laptop
        type: output
        label: Report
        description: "finish with the report and a Known gaps: line; for reviewer and security, the JSON verdict only (no verdict fails the run)."
        meta: { finish_alone: "A finish sent in the same reply as other tool calls is refused: those tools run, their results go back, and finish must come in a later reply, after the model has read them (#426)." }
        files: [roles/reviewer.md]
      - id: failed
        runtime: laptop
        type: output
        label: Run failed
        description: "Exit 1 (2 for a bad --write), with the reason on stdout or stderr. A run that got past the key writes its ledger line with the outcome: http-error, batch-error, empty-answer, truncated-answer, no-verdict, step-cap, crash (an uncaught throw or a timeout) or interrupted."
        meta: { interrupt: "SIGINT (130) and SIGTERM (143) record interrupted and delete a pending batch within 5 s; the exit handler records crash for any exit that wrote no line, and closes the live node as error." }
        files: [README.md]
      - id: ledger
        runtime: laptop
        type: memory
        label: Ledger line
        description: "Role, model, mode, steps, tokens, cache share and the cost OpenRouter reports."
        files: [README.md]
    edges:
      - "oneshot -> report: answer with a verdict"
      - "oneshot -> failed: HTTP error, empty, cut, no verdict"
      - "report -> ledger [data]: cost"
      - "failed -> ledger [data]: outcome, once past the key"

links:
  - "start.mode -> loop.call: loop"
  - "start.mode -> end.oneshot: oneshot or batch"
  - "loop.tools -> end.report: finish, alone"
  - "loop.call -> end.failed: HTTP error, no answer twice"
  - "loop.tools -> end.failed: no verdict twice"
  - "loop.cap -> end.failed: step cap"
  - "start.args -> end.failed: usage"
  - "start.config -> end.failed: bad squad.json"
  - "start.key -> end.failed: no key"
  - "start.mode -> end.failed: mode clash"
