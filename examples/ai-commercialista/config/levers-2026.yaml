    status: closed
    window: "last bookings 31/12/2025; esodati credit usable in F24 by 31/12/2026 (code 7079)"
    url: "https://www.mimit.gov.it/it/incentivi/piano-transizione-5-0"
    confidence: medium
    abuse_risk_default: green
    notes: "Funds exhausted (DD MIMIT 6/11/2025). Esodati share 89.77% and code 7079 are medium confidence. Credit not carried forward and not taxable. Lever now: use it in F24 by 31/12/2026 or lose it."

