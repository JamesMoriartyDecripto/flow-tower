apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-svc
  namespace: shop
  labels: { app: checkout-svc, team: payments }
spec:
  replicas: 3
  selector:
    matchLabels: { app: checkout-svc }
  template:
    metadata:
      labels: { app: checkout-svc }
    spec:
      containers:
        - name: checkout
          image: ghcr.io/example-org/checkout-svc:2026.10.07-a1b9f3e
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 128Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 10
