# yaml-language-server: $schema=../../schema/flow-tower.schema.json
version: 1
name: Voice Commands
tags: [voice, speech-to-text, text-to-speech, voice-agent, openrouter, whisper, browser, learning, dogfooding]
description: >-
  The voice widget of Flow Tower itself (issues #62, #63, #68 and #72-#74), mapped from its code. Press V (or MIC) and
  speak in Italian or English. Navigation ("apri dev squad", "livello 2", "vai al nodo triage") goes to a
  local parser (no LLM) and runs the same store calls as the keyboard. Questions and references to the
  screen ("cosa c'è nel secondo livello?", "a cosa è collegato questo nodo") go to a conversational agent:
  an OpenRouter chat model with 13 tools that run in the page on the tower on screen, whose short reply is
  streamed into the caption and spoken sentence by sentence. Audio goes to the local flow-tower server and on
  to OpenRouter with zero data retention. With "Learn from my sessions" on, each turn is written to a text
  journal in the user's folder; a review proposes aliases for misheard names and notes for the agent, which
  apply only once the user accepts them. The speech engines that were weighed are drawn as planned alternatives; the model choices
  for the agent and the voice open their own pages. Paths are relative to the repository root, so every
  reference opens the real file.
root: ../..

runtimes:
  browser:
    kind: browser
    label: Your browser
    description: "The Flow Tower page: Firefox, Chrome, Edge or Safari. Mic, end-of-speech detection, routing, parser, the agent loop, its tools and the <audio> playback all run here. The static demo has no server, so it hides the MIC button."
  server:
    kind: local
    label: flow-tower server
    description: "The local Vite dev server started by bin/flow-tower.js, with the flowTower plugin's middleware. Holds the OpenRouter key; the page never sees it."
    host: 127.0.0.1:5317
  openrouter:
    kind: saas
    label: OpenRouter
    description: "Three endpoints: /audio/transcriptions (speech to text), /chat/completions (one agent step) and /audio/speech (the spoken reply), each routed with provider.zdr to providers OpenRouter lists as zero data retention."
    provider: openrouter
    url: https://openrouter.ai/docs/guides/overview/multimodal/stt

agents:
  guide:
    name: Voice guide
    description: >-
      converse() in agent.ts. The system prompt (PROMPT, in the same file) asks for one or two short spoken
      sentences of plain text in the user's language, tools instead of guesses, tools called together in one
      step, showing what it talks about (focus_layer, select_node), and saying an action is done only after
      its tool succeeded. Notes the user accepted from journal reviews (#68) are added as a second system
      message, as preferences that never override the instructions, tool results or screen. Every LLM step goes through POST /api/voice/chat, streamed; tool calls run in the page.
      Illustrative numbers, measured on the dev-squad tower (commit 86234b9): 1.1-2.9 s and about $0.001 per
      turn. No budget cap in the code.
    model: google/gemini-3.1-flash-lite
    tools: [screen, list_layers, layer_nodes, search, node_info, connections, node_files, read_file, focus_layer, select_node, open_file, open_project, navigate]
    runtime: browser
    files: [src/app/voice/agent.ts, src/app/voice/tools.ts, examples/voice-commands/options/llm-intent.md]
    limits: { max_iterations: 4, description: "At most 4 LLM steps per turn; the last one is sent with answer: true, so the server asks for tool_choice none and the model must answer with what it has." }
    data: { retention: none, description: "Transcript text, the screen state and tool results go to OpenRouter (ZDR endpoints); no audio. The last 12 messages, text only, stay in page memory until the mic turns off." }
    evals:
      - { name: turn time, value: 2.9, unit: s, higher_is_better: false, illustrative: true, description: "1.1-2.9 s per agent turn on dev-squad, measured once (slowest shown)." }
      - { name: cost per turn, value: 0.001, unit: USD, higher_is_better: false, illustrative: true, description: "About $0.001 per turn on dev-squad, measured once." }

layers:
  # 1 ───────────────────────────────────────────────────────────────
  - id: capture
    title: Capture
    description: "Turn speech into short compressed clips, one per command, without a push-to-talk button: tell a voice from a fan, and drop what was recorded over the agent's own reply before it costs a transcription."
    nodes:
      - id: hotkey
        type: entry
        label: V key / MIC
        runtime: browser
        description: "V toggles voice in the tower and in the library (App.tsx); the MIC button in the top bar and the library header does the same. A second press (or ✕ on the caption) stops listening, and with it any reply being spoken."
        trigger: { kind: manual, source: V key or MIC button }
        files: [src/app/App.tsx, src/app/hud/Voice.tsx, src/app/hud/Chrome.tsx, src/app/hud/Library.tsx]
      - id: esc
        type: entry
        label: Esc key
        runtime: browser
        description: "Esc first calls hush() (App.tsx, before any other Esc action): if a reply is active (its first sentence synthesizing or any sentence playing) it stops it, and the mic stays on. An agent turn still being written is muted too: no further sentence is spoken, its stream is aborted so no later tool call moves the view, the caption says Stopped and the turn is journaled interrupted; a turn already journaled is marked interrupted. With nothing active, Esc does its usual job (closes help or Settings, goes back)."
        trigger: { kind: manual, source: Esc key }
        files: [src/app/App.tsx, src/app/voice/voice.ts]
      - id: prefs
        type: memory
        label: Voice settings
        runtime: browser
        description: "Settings > Voice, saved with the browser's preferences. Microphone sensitivity: Low (noisy laptops: a fan that opens clips by itself; speak a little louder), Normal (default) or High (quiet rooms, soft voices), read at every tick so a change applies at once. Interrupt by voice: off by default, so laptop speakers cannot make the agent answer itself; on, with headphones, words spoken over a reply can cut it."
        files: [src/app/settings.ts, src/app/hud/Settings.tsx]
      - id: start
        type: decision
        label: Key configured?
        runtime: browser
        description: "start() asks GET /api/voice what the server has ({ cloud, model, agent, tts, journal }, never the key) and keeps whether an agent model is set; it also loads the voice memory (GET /api/voice/memory) for the aliases, the agent notes and the suggestions chip. No key: the caption says how to add it; no answer (server down): it says the local server is not reachable. Either way the mic is never opened; the error fades after 8 s or closes with ✕. The static demo has no MIC at all."
        decision: { output: binary, candidates: [yes, no], fail: closed }
        files: [src/app/voice/voice.ts]
      - id: mic
        type: process
        label: Mic + recorder
        runtime: browser
        description: >-
          getUserMedia (echo cancellation, noise suppression, auto gain, mono) feeds a MediaRecorder that runs all the
          time and an AnalyserNode (fftSize 2048) read every 40 ms. When speech ends the recorder is cut and a new one
          starts at once, so the next command loses no syllable. Without speech the recording is thrown away every
          1.5 s, so a clip holds the command and little else (billed per second; Whisper invents words in long
          silences). Echo cancellation removes most of the agent's own voice, which plays through an <audio> element;
          the half-duplex gate drops what gets through.
        files: [src/app/voice/mic.ts]
      - id: floor
        type: memory
        label: Noise floor
        runtime: browser
        description: "One noise level per frequency bin of the voice band. Seeded by the first ticks (never 0), then calibrated from 200 to 700 ms after the mic opens as the per-bin minimum (updateFloor in noise.ts): speech has gaps between syllables, so the minimum is the room even if the user speaks at once, where an average would learn the voice. A minimum sits below the room's average, so calibration keeps a x1.5 margin over it (+1.8 dB): a fan wobbling just above it does not count as loud. The analyser's first 200 ms understate the room, so they only seed it; no speech is accepted meanwhile. Clamped to -120..-55 dB. Then it follows the room: 5% per tick while quiet, 0.2% while speaking, never more than 4x in one tick, so a fan spinning up raises it instead of counting as speech."
        files: [src/app/voice/mic.ts, src/app/voice/noise.ts, tests/voice-noise.test.ts]
      - id: detect
        type: decision
        label: Speech or noise?
        runtime: browser
        description: >-
          isSpeech() on each 40 ms tick, over 300-3400 Hz: the band must be louder than its floor (power ratio 10, 6
          or 3 for Low, Normal, High) and than an absolute minimum (-60, -66 or -72 dB), and its spectrum, divided bin
          by bin by the floor (whitened), must be peaky. Spectral flatness under 0.3, 0.4 or 0.5: a fan or hiss whitens
          to about 0.65-0.95, voiced speech to 0.13-0.25 (figures from a simulation of the analyser, in noise.ts).
          Speech followed by ~0.6 s of silence, or 8 s of speech, cuts the clip; under 0.2 s of speech (a click, a
          cough) is dropped.
        decision: { output: binary, candidates: [speech, noise] }
        limits: { timeout: 8s, description: "A clip is cut after at most 8 s of speech." }
        files: [src/app/voice/noise.ts, src/app/voice/mic.ts, tests/voice-noise.test.ts]
      - id: clip
        type: memory
        label: Audio clip
        runtime: browser
        description: "Opus in WebM or Ogg (Chrome, Edge, Firefox) or AAC in MP4 (Safari), 32 kbps: a 2 s command is ~10 KB. It carries its recording time (when the speech started, when the clip was cut), so every later decision about it uses when it was recorded, not when its transcript comes back. Kept in memory only; clips are transcribed and handled one at a time, in order."
        data: { sensitivity: pii, retention: none, description: "A voice recording. Sent once to the local server and on to OpenRouter with ZDR routing; never written to disk." }
        files: [src/app/voice/mic.ts, src/app/voice/duplex.ts]
      - id: duplex
        type: guard
        label: Half-duplex gate
        runtime: browser
        description: "keepClip(): a clip recorded while a reply was playing, or up to 700 ms after it ended (the room still rings, the recorder lags), is the reply itself coming out of laptop speakers: it is dropped before transcription, so it costs nothing and cannot start a loop. With Interrupt by voice on (headphones) it is kept for the barge-in check. \"Playing\" is one state, isSpeaking() in agent.ts, from the first sentence being synthesized until the queue drains: the active span, the same for the caption, Esc and this gate. A second kind, the audible span, covers only sentences coming out of the speakers: the barge-in rule looks at that one, so with Interrupt by voice on a clip during the silent wait for synthesis is a normal command. A clip that started in the 700 ms tail, not during the reply, shows once per session \"Wait a moment after the reply, or press Esc to interrupt it.\""
        files: [src/app/voice/duplex.ts, src/app/voice/voice.ts, tests/voice-duplex.test.ts]
    edges:
      - "hotkey -> start: toggle on"
      - "start -> mic: yes"
      - "mic -> floor [data]: first 0.7 s"
      - "mic -> detect [data]: spectrum, 40 ms"
      - "floor -> detect [data]: whitening"
      - "prefs -> detect [data]: sensitivity"
      - "detect -> clip: speech, ~0.6 s silence"
      - "clip -> duplex: recording time"
      - "prefs -> duplex [data]: interrupt by voice"

  # 2 ───────────────────────────────────────────────────────────────
  - id: transcription
    title: Transcription
    description: Which engine turns the clip into text. One is wired; the others were weighed and are kept here with the reason they lost.
    nodes:
      - id: engine
        type: decision
        label: Speech engine
        description: >-
          A design choice made once in code, not at run time. OpenRouter STT won: the same path in every browser,
          Firefox included, no model download, about a second per command. The dashed alternatives open the page that
          says why each was not chosen.
        decision: { output: choice, candidates: [openrouter-stt, web-speech-local, web-speech-cloud, whisper-browser] }
        files: [examples/voice-commands/README.md]
      - id: send
        type: process
        label: Upload clip
        runtime: browser
        description: "transcribe(): base64 of the clip and its format (read from what the browser recorded) as JSON to POST /api/voice. The language set in Settings (Spoken language: Auto, Italiano, English), or none on Auto, where Whisper detects it from the clip. Any error reply or network failure goes to the caption; an empty transcript does nothing."
        files: [src/app/voice/voice.ts, src/app/hud/Settings.tsx]
      - id: stt
        type: tool
        label: OpenRouter STT
        runtime: openrouter
        model: openai/whisper-large-v3-turbo
        description: "Measured once: ~1.2 s and ~$0.000005 for a ~10 KB Italian command (illustrative). With provider.zdr it is routed only to endpoints OpenRouter lists as zero retention (DeepInfra or Groq for this model)."
        data: { sensitivity: pii, description: "Zero data retention per OpenRouter's recorded provider policies; not independently verified." }
        files: [examples/voice-commands/options/openrouter-stt.md, src/server/voice.ts]
      - id: local
        type: tool
        label: Web Speech local
        status: planned
        runtime: browser
        description: "Why not: on-device SpeechRecognition (processLocally) exists only in Chrome 139+ and needs a language pack installed first; Safari has no processLocally and Firefox release has no SpeechRecognition at all."
        files: [examples/voice-commands/options/web-speech-local.md]
      - id: cloud
        type: tool
        label: Web Speech cloud
        status: planned
        runtime: browser
        description: "Why not: Chrome sends the audio to Google's service and the page can neither choose the provider nor ask for zero retention; Safari needs Siri/Dictation enabled, and Firefox release has no SpeechRecognition (Nightly only)."
        files: [examples/voice-commands/options/web-speech-cloud.md]
      - id: whisper
        type: tool
        label: Whisper in browser
        status: planned
        runtime: browser
        description: "Why not: transformers.js downloads ~41 MB (tiny q8) to ~564 MB (large-v3-turbo q4f16) before the first command, and Firefox on Intel Macs and Linux has no WebGPU, so it falls back to slower WASM."
        files: [examples/voice-commands/options/whisper-browser.md]
    edges:
      - { from: engine, to: send, group: stt, label: OpenRouter (active) }
      - { from: engine, to: local, group: stt, label: on-device }
      - { from: engine, to: cloud, group: stt, label: browser cloud }
      - { from: engine, to: whisper, group: stt, label: WebGPU model }

  # 3 ───────────────────────────────────────────────────────────────
  - id: understanding
    title: Understanding
    description: "Turn-taking gates, then the route: questions go to the agent, navigation to the local parser, which matches the words against the names on screen instantly and offline."
    nodes:
      - id: echo
        type: guard
        label: Echo filter
        runtime: browser
        description: "isEcho(): only for a clip recorded while a reply played or within 700 ms after it (judged on the recording time, not on when the transcript came back), a transcript whose words (3+ letters or digits) are at least 60% words of the reply is the agent hearing itself, missed by the browser's echo cancellation: dropped without a trace. With half-duplex on (the default) such clips never get here."
        files: [src/app/voice/duplex.ts, src/app/voice/agent.ts, src/app/voice/voice.ts, tests/voice-duplex.test.ts]
      - id: noise
        type: guard
        label: Whisper noise
        runtime: browser
        description: "isHallucination(): what Whisper writes for noise or silence, having learned from subtitled video. A transcript that is only \"Grazie.\", \"Grazie a tutti\", \"Thank you.\", \"Thanks for watching\", \"you\", a subtitle credit (Amara.org, Sottotitoli...), \"[Musica]\" or punctuation is dropped before it is handled or journaled. Compared without case, accents or punctuation; \"grazie, apri il livello due\" still runs."
        files: [src/app/voice/noise.ts, src/app/voice/voice.ts, tests/voice-noise.test.ts]
      - id: bargein
        type: decision
        label: Barge-in?
        runtime: browser
        description: "Only for a clip recorded while a reply was audible (a sentence coming out of the speakers, not the silent wait for synthesis), which needs Interrupt by voice on: otherwise the half-duplex gate dropped it already. A stop word (stop, basta, ferma, zitto, silenzio, enough, quiet...) stops the reply and ends there; fewer than 3 words (a cough, \"ok\") are ignored and the reply goes on; 3 or more words stop the reply and are handled as a new request (Pipecat's minimum-words rule)."
        decision: { output: choice, candidates: [not during a reply, stop word, under 3 words, 3+ words] }
        files: [src/app/voice/duplex.ts, src/app/voice/voice.ts, tests/voice-duplex.test.ts]
      - id: route
        type: decision
        label: Agent or parser?
        runtime: browser
        description: "handle() first applies the aliases the user accepted (Learning), then wantsAgent(): a question mark, a question word at the start (cosa, quanti, what, which...), a request (dimmi, spiega, explain, tell...) or a reference to the screen (questo, this, file, collegato, connected, il primo, the first, aprilo...) goes to the agent. Everything else goes to the parser first. Without an agent model on the server, everything goes to the parser."
        decision: { output: binary, candidates: [agent, parser] }
        files: [src/app/voice/agent.ts, src/app/voice/voice.ts, tests/voice-agent.test.ts]
      - id: pick
        type: decision
        label: Pending pick?
        runtime: browser
        description: "run(): if the last command offered a numbered choice and this phrase is only a pick (\"one\", \"due\", \"3\"; up to 4), that option is taken without parsing. With the agent on, \"il primo\", \"la prima\", \"il secondo\", \"the first\", \"the second\" match wantsAgent and go to the agent instead, which does not see the parser's numbered list."
        decision: { output: binary, candidates: [pick, parse] }
        files: [src/app/voice/voice.ts]
      - id: parser
        type: process
        label: Local parser
        runtime: browser
        description: >-
          parseCommand(): normalise (lowercase, no accents), drop stop words and command verbs, then fixed phrases
          (mic off, library, back, overview, map, tower view, enter, close), layer numbers and ordinals, and fuzzy
          names of projects, layers and nodes (edit distance for misheard words). Italian and English.
        files: [src/app/voice/commands.ts, tests/voice-commands.test.ts]
      - id: ambiguous
        type: decision
        label: Ambiguous?
        runtime: browser
        description: "best(): candidates scoring >= 0.5; those within 0.05 of the top are a tie. One wins: an action. Several: a numbered choice of up to 4. None: \"Not understood\", which goes on to the agent when there is one."
        decision: { output: choice, candidates: [one, several, none], threshold: 0.5 }
        files: [src/app/voice/commands.ts, src/app/voice/voice.ts]
    edges:
      - "echo -> noise: not an echo"
      - "noise -> bargein: real words"
      - "bargein -> route: no reply, or 3+ words"
      - "route -> pick: navigation"
      - "pick -> parser: parse"
      - parser -> ambiguous
      - "ambiguous -> pick [return]: several, say 1-4"

  # 4 ───────────────────────────────────────────────────────────────
  - id: conversation
    title: Conversation
    description: "The voice agent (#63): an LLM step on the server, tool calls in the page, at most 4 steps; the short answer is shown and spoken."
    nodes:
      - id: context
        type: memory
        label: Screen + history
        runtime: browser
        description: "Each turn sends the system prompt, the notes the user accepted from journal reviews (a second system message, only when there are some), the last 12 messages (user words and replies only, no tool traffic), a fresh \"Screen now\" from the screen tool (library or tower, focused layer, selected node, open file, view) and the transcript. stop() calls forget(): one listening session is one conversation."
        data: { retention: none, description: "Page memory only." }
        files: [src/app/voice/agent.ts]
      - id: agent
        agent: guide
        label: Voice guide
        description: "converse(): posts { messages, tools, answer, stream: true } to /api/voice/chat and reads the reply as it streams (each tool step and the text appear in the caption), appends the assistant message, runs every tool call it carries and loops; a message without tool calls is the reply (… if empty). An error reply or network failure throws and the caption shows it. A mic stop aborts the turn: the request is cancelled and no further tool runs."
      - id: llm
        type: model
        label: Gemini Flash-Lite
        runtime: openrouter
        model: google/gemini-3.1-flash-lite
        description: "One chat completion per step: max_tokens 500, tool_choice auto (none on the last step), provider { zdr, require_parameters } so only endpoints that support tools and keep no data serve it. FLOW_TOWER_AGENT_MODEL picks another model (Claude Haiku 5.5 or Mistral Small 4: see the options page); there is no automatic fallback."
        files: [examples/voice-commands/options/llm-intent.md, src/server/voice.ts]
      - id: step
        type: decision
        label: Tool calls?
        runtime: browser
        description: "Tool calls: run them and take another step. None: the content is the answer. Step 4 is sent with answer: true, so it cannot call tools any more."
        decision: { output: choice, candidates: [tool calls, answer] }
        limits: { max_iterations: 4 }
        files: [src/app/voice/agent.ts]
      - id: tools
        type: tool
        label: Tower tools
        runtime: browser
        tools: [screen, list_layers, layer_nodes, search, node_info, connections, node_files, read_file, focus_layer, select_node, open_file, open_project, navigate]
        description: >-
          runTool(): 13 tools that run in the page on the workspace on screen, so answers are true to the tower. Read:
          screen, list_layers, layer_nodes (with the layer's flow), node_info, connections, node_files, read_file (the
          file text through /api/file, same guards as the viewer, to explain a file). Act (same store calls as the keyboard):
          focus_layer, select_node, open_file, open_project, navigate. search reads and acts: it also fills the top-bar
          search so the matches are highlighted. Names are matched fuzzily, on screen first, then in the library; an
          omitted node or layer means the selection. Errors come back as JSON the model can recover from.
        files: [src/app/voice/tools.ts, tests/voice-tools.test.ts]
      - id: ack
        type: process
        label: Acknowledgement
        runtime: browser
        description: "Filler for the silence before the first sentence (#70): 600 ms after the end of speech, if the agent has said nothing, a cached phrase (\"One moment.\", \"Let me see.\", in the user's language) plays through the reply player. Synthesized once when the mic starts; one per turn; 60 s cooldown after a failed synthesis. Measured first audio: 1.9-2.9 s down to 0.60-0.65 s."
        evals:
          - { name: first audio, value: 0.62, unit: s, higher_is_better: false, illustrative: true, description: "Measured: 1.9-2.9 s before, 0.60-0.65 s with the ack." }
        files: [src/app/voice/ack.ts, tests/voice-agent.test.ts]
      - id: speak
        type: process
        label: Spoken reply
        runtime: browser
        description: "Only with Settings > Spoken replies on (default on); off, the answer is only in the caption. say(): each finished sentence of the streamed reply is queued and synthesized shortly before its turn (POST /api/voice/speak: one sentence ahead while waiting for audio, two once it plays, since /speak shares the server's 6 slots with the chat stream and transcription; a 429 is retried once after 0.5 s, then the sentence is skipped, and so is one whose speech takes over 8 s), then played in order, one <audio> element at a time, so the voice starts on the first sentence. The reply is active from its first say() until the queue drains (isSpeaking): that span is what the half-duplex gate and the echo filter see; each sentence while it plays is an audible span, what barge-in sees. A sentence whose speech request fails, or whose audio cannot be decoded, is skipped, so a reply never stays active and the mic deaf; if the browser refuses to play (NotAllowedError, autoplay blocked), the caption says so once and the reply ends at once, so it does not hold the half-duplex gate. stopSpeaking() pauses it and drops the queue: Esc, barge-in, mic off, or a new reply."
        data: { retention: none, description: "The reply audio lives in a blob URL until playback ends." }
        files: [src/app/voice/agent.ts, src/app/voice/voice.ts, src/app/hud/Settings.tsx, src/app/settings.ts]
      - id: tts
        type: tool
        label: ElevenLabs TTS
        runtime: openrouter
        model: elevenlabs/eleven-flash-v2.5
        description: "One multilingual voice (alice) for every language, so the reply follows the user's language; mp3, ZDR. FLOW_TOWER_TTS_MODEL and FLOW_TOWER_TTS_VOICE pick others. Alternatives on the options page."
        evals:
          - { name: speech time, value: 0.7, unit: s, higher_is_better: false, illustrative: true, description: "About 0.7 s for a two-sentence reply, measured once." }
        files: [examples/voice-commands/options/tts.md, src/server/voice.ts]
    edges:
      - "context -> agent [data]: screen + 12 msgs"
      - "agent -> step: message"
      - "step -> tools [call]: tool calls"
      - "tools -> agent [return]: results, max 4"
      - "step -> context [data]: words kept"
      - "step -> speak: answer, if on"
      - "ack -> speak [data]: cached phrase"
      - "agent -> ack [call]: silent 600 ms"

  # 5 ───────────────────────────────────────────────────────────────
  - id: actions
    title: Actions
    description: Parser commands and agent tools run through the same store calls as the keyboard, and the caption says what was heard and what it did.
    nodes:
      - id: execute
        type: process
        label: Run action
        runtime: browser
        description: "execute(): library, open a tower, focus a layer, select a node (opening its tower first), map or tower view, overview, back, enter a sub-tower, close, mic off. Returns the text for the caption."
        files: [src/app/voice/voice.ts]
      - id: store
        type: memory
        label: App store
        runtime: browser
        description: "showLibrary, openPath, select, focusLayer, resetView, enterTower, goTo, openFile, set({ search }); towerPath builds the deep link to a tower; chooseView switches map and tower. Copy-on-write zustand state."
        files: [src/app/store.ts, src/app/graph.ts, src/app/settings.ts]
      - id: caption
        type: output
        label: Caption
        runtime: browser
        description: "VoiceCaption: status, “heard” → did (the action, \"…\" while the agent works, then its answer), the numbered choice, \"Not understood\", or the error. role=status, aria-live polite, so screen readers announce it without interrupting. The CLOUD STT chip says audio leaves the machine."
        files: [src/app/hud/Voice.tsx]
      - id: idle
        type: guard
        label: Idle stop
        runtime: browser
        description: "Listening stops by itself after 2 minutes without an understood command or an agent answer (privacy, battery). Armed when the mic opens and re-armed only by those two: dropped clips, Whisper noise or errors do not keep the mic alive."
        limits: { timeout: 120s }
        files: [src/app/voice/voice.ts]
      - id: off
        type: output
        label: Mic off
        runtime: browser
        description: "stop(): aborts the agent turn in flight, stops a spoken reply, clears the conversation history and the agent's search, asks for a journal review when one is due (Learning), closes the recorder, stops the tracks, closes the AudioContext and drops a pending choice."
        files: [src/app/voice/voice.ts, src/app/voice/mic.ts]
    edges:
      - "execute -> store [call]: same as keys"
      - "execute -> caption: did"
      - "execute -> idle: understood, re-arm"
      - "execute -> off: mic off"
      - "idle -> off: 2 min silence"

  # 6 ───────────────────────────────────────────────────────────────
  - id: learning
    title: Learning
    description: "The voice journal (#68): opt-in, text only, in the user's folder outside every repo. A review by the chat model proposes aliases for misheard names and notes for the agent; nothing applies until the user accepts it."
    nodes:
      - id: toggle
        type: guard
        label: Learn toggle
        runtime: browser
        description: "Settings > Voice > Learn from my sessions, off by default and saved with the browser's preferences. It gates the journal lines, the outcome marks and the automatic review; Review now is disabled while it is off. Aliases and notes already accepted keep applying either way: they are loaded at every start."
        files: [src/app/hud/VoiceLearning.tsx, src/app/settings.ts, src/app/voice/journal.ts]
      - id: record
        type: process
        label: Record turn
        runtime: browser
        description: "record(), called by handle(): parser and pick turns (what it did, done or not_understood; a parser miss that goes on to the agent is recorded once, as the agent turn), agent turns (reply, tools used, ms, cost, and the time from the transcript to the first spoken sentence, so an agent turn is written once its voice starts, waiting at most 10 s) and agent errors, with the tower on screen. The raw transcript is kept, before aliases, so a review sees what the recognizer wrote. POST /api/voice/journal, fire and forget; each turn also counts towards the next review."
        files: [src/app/voice/journal.ts, src/app/voice/voice.ts]
      - id: marks
        type: process
        label: Outcome marks
        runtime: browser
        description: "judgeLast(), at the start of handle(), reads the next transcript: a correction (\"no, ...\", \"non quello\", \"not that\", \"wrong\", \"sbagliato\", \"ho detto\", \"i meant\"...; not a command that starts with \"non\", like \"non mostrare...\") within 15 s marks the last turn corrected (the transcript is normalized first: NFC, leading quotes and punctuation dropped, so «No, quello» counts); \"back\", \"indietro\", \"annulla\" or \"undo\" alone within 6 s of an action marks it undone. Esc or a barge-in marks it interrupted, and the next words may still correct it. Sent as POST /api/voice/journal { mark: { ts, outcome } }; one mark per turn."
        files: [src/app/voice/journal.ts, src/app/voice/voice.ts]
      - id: journal
        type: memory
        label: Voice journal
        runtime: server
        description: >-
          voice-journal.jsonl in the user's folder (~/.config/flow-tower, or FLOW_TOWER_HOME), outside every repo.
          One JSON line per turn: time, what was heard, route (parser, agent, pick), what happened, outcome, tower,
          tools, ms, cost, time to first audio; text flattened to one line and cut. Marks are appended and applied
          when read, and each review adds a line with how many entries it read and its cost; a torn line is skipped. The default folder 0700 (an existing FLOW_TOWER_HOME keeps its permissions), file 0600 (owner only). Past 5 MB the older half is dropped. Never audio.
        data: { sensitivity: pii, description: "What the user said and what the app did, as text. Kept on this machine until rotation or Forget everything; the review sends the new part to OpenRouter (ZDR endpoints)." }
        files: [src/server/voice-memory.ts, tests/voice-journal.test.ts]
      - id: due
        type: decision
        label: Review due?
        runtime: browser
        description: "reviewIfDue() at mic off: the journal is on and 20 or more turns were recorded since the last review in this page (the count starts again on reload). Otherwise nothing is sent. One at a time; the turns a review covered come off the count, success or failure, so a failed one (maybe paid) waits for 20 more turns. Review now in Settings asks at once."
        decision: { output: binary, candidates: [review, wait], threshold: 20 }
        files: [src/app/voice/journal.ts, src/app/voice/voice.ts]
      - id: review
        type: process
        label: Journal review
        runtime: server
        description: >-
          POST /api/voice/review (needs the key). Takes the journal entries after the last review, the oldest 200 first,
          and the real names of the towers they mention (every project, plus the layers, nodes and agents of those
          towers, up to 600). One chat completion with the review prompt: names, accepted aliases and notes, waiting
          suggestions and the compact entries (heard, route, what happened, outcome). Strict json_schema reply,
          max_tokens 1200, usage included, same chat model with ZDR and require_parameters. One review at a time
          (409). The review and its cost are logged; if Forget everything ran meanwhile, nothing is written back.
          The memory is read again after the call, so decisions made meanwhile stay, and the reviewed mark moves to
          the last entry read, so what did not fit goes to the next review. An OpenRouter error or an unreadable reply
          answers 502, and the same entries go to the next review.
        limits: { description: "At most 200 new entries per review, the oldest first; the rest wait for the next one, never skipped." }
        data: { sensitivity: pii, description: "The new journal text goes to OpenRouter (ZDR endpoints)." }
        files: [src/server/voice-learning.ts, src/server/plugin.ts]
      - id: filter
        type: guard
        label: Real names only
        runtime: server
        description: "accept(): at most 8 suggestions. An alias must point at one of the real names (any case; the name's own spelling is kept), differ from what was heard, be new, and match a real word: at least 3 characters and not only common words (il, la, the, open, layer, node...), which would rewrite every transcript, nor be part of a real name (\"triage\" for \"Triage router\" would make \"Triage router router\"); a rule or style note must be non-empty and new. Duplicates of accepted or waiting ones are dropped; text is cut at 300 characters."
        files: [src/server/voice-learning.ts, tests/voice-journal.test.ts]
      - id: memory
        type: memory
        label: Voice memory
        runtime: server
        description: "voice-memory.json next to the journal, 0600, rewritten atomically (temp file and rename): the accepted aliases and notes (rule, style), the suggestions waiting for a decision with why and evidence, and how far the journal was reviewed. Accepted notes are capped at 20 and 2000 characters: one more is refused (409) until one is removed. Missing or unreadable reads as empty; malformed items are dropped."
        data: { sensitivity: pii, description: "Derived from the user's own words; deleted by Forget everything." }
        files: [src/server/voice-memory.ts]
      - id: panel
        type: human
        label: Settings panel
        runtime: browser
        description: "VoiceLearning in Settings > Voice: the toggle; the last 7 days (turns, % not understood, corrected, undone, interrupted, average agent time, time to first audio, cost, reviews and their cost); Suggestions with Accept and Reject; Learned, with ✕ to remove one; Review now; Forget everything, after a confirm, deletes the journal and the memory. Each decision is a POST /api/voice/memory."
        approval: { by: the user, actions: [approve, reject], via: Settings > Voice, on_timeout: wait, description: "Nothing a review proposes applies until it is accepted here." }
        files: [src/app/hud/VoiceLearning.tsx, src/app/hud/Settings.tsx]
      - id: chip
        type: output
        label: Suggestions chip
        runtime: browser
        description: "N SUGGESTIONS in the caption while suggestions wait; a click opens Settings. The count comes from the memory at every start and from an automatic review; any decision in the panel clears it. With suggestions waiting the caption stays while the mic is off, so a review run at mic off shows at once; ✕ dismisses it."
        files: [src/app/hud/Voice.tsx, src/app/voice/voice.ts]
      - id: aliases
        type: process
        label: Apply aliases
        runtime: browser
        description: "applyAliases() at the start of handle(), before the route: each accepted alias replaces the misheard phrase with the real name, whole words only, ignoring case and accents (\"triaje\" becomes \"triage\"), never inside a name already written out; an alias under 3 characters is skipped. The parser and the agent both get the corrected text; the journal keeps the raw one."
        files: [src/app/voice/journal.ts, src/app/voice/voice.ts, tests/voice-journal.test.ts]
      - id: notes
        type: memory
        label: Agent notes
        runtime: browser
        description: "notesForAgent(): the accepted rules and reply-style notes as a list, passed to converse() and sent as a system message framed as the user's preferences: they shape understanding and wording, and never override the instructions, the tool results or what is on screen. Capped like the server (20 notes, 2000 characters). Page memory, loaded at every start."
        files: [src/app/voice/journal.ts, src/app/voice/agent.ts]
    edges:
      - "toggle -> record: on"
      - "toggle -> marks: on"
      - "record -> journal [data]: one line"
      - "marks -> journal [data]: mark line"
      - "toggle -> due: on"
      - "due -> review [call]: 20+ turns"
      - "journal -> review [data]: oldest 200"
      - "review -> filter: max 8"
      - "filter -> memory [data]: pending"
      - "memory -> panel [data]: suggestions"
      - "journal -> panel [data]: 7-day stats"
      - "panel -> memory [data]: accept, reject"
      - "panel -> review [call]: Review now"
      - "panel -> journal: forget all"
      - "memory -> chip [data]: pending count"
      - "chip -> panel: opens Settings"
      - "memory -> aliases [data]: each start"
      - "memory -> notes [data]: each start"

  # 7 ───────────────────────────────────────────────────────────────
  - id: server
    title: Server & Secrets
    description: "The only part with the key. JSON-only routes on the local server: three that spend the key (speech to text, an agent step, speech) and three for the voice journal, with every rejection a JSON error the caption shows."
    nodes:
      - id: secrets
        type: memory
        label: Local secrets
        runtime: server
        description: "At startup plugin.ts loads the dotenv file in the user's folder (~/.config/flow-tower, or FLOW_TOWER_HOME) first, then the git-ignored one in the flow-tower folder as a fallback. Real environment variables win, then the user's folder, then the repo folder. No tower reads either: src/core/secrets.ts (isForbidden) refuses key and credential files, credential folders and anything inside the user's folder, even inside a tower root (this tower's root is the flow-tower folder). /api/file answers 403; the loader reports a prompt file:, agent from: or nested tower pointing at one as \"is a secret file or in the user folder (~/.config/flow-tower): not read\", without checking whether it exists. The tower file itself is checked by its real path before it is read (a repository could ship x.tower.yaml linked to the voice journal, and YAML errors quote the lines they fail on), and folder scans skip symlinks that leave the scanned folder or enter the user's folder. home.ts warns at startup when FLOW_TOWER_HOME is inside the flow-tower folder, symlinks followed. FLOW_TOWER_VOICE_MODEL, FLOW_TOWER_AGENT_MODEL, FLOW_TOWER_TTS_MODEL and FLOW_TOWER_TTS_VOICE pick other models; FLOW_TOWER_VOICE_ZDR=0 turns the ZDR filter off."
        data: { sensitivity: secret }
        meta: { secret: OPENROUTER_API_KEY, stt: FLOW_TOWER_VOICE_MODEL, agent: FLOW_TOWER_AGENT_MODEL, tts: "FLOW_TOWER_TTS_MODEL, FLOW_TOWER_TTS_VOICE", zdr: FLOW_TOWER_VOICE_ZDR }
        files: [src/core/secrets.ts, src/core/loader.ts, src/server/plugin.ts, src/server/home.ts, src/server/files.ts, .gitignore]
      - id: route
        type: process
        label: /api/voice
        runtime: server
        description: "Mounted by the flowTower plugin, with sub-routes / (speech to text), /chat (one agent step) and /speak (the spoken reply), plus /journal, /memory and /review (the voice journal, voice-learning.ts). GET / answers { cloud, model, agent, tts, journal }: whether a key is set, never the key, the models in use and whether the journal routes are mounted; GET /journal and /memory answer the stats and the memory. POST runs the route."
        files: [src/server/plugin.ts, src/server/voice.ts]
      - id: guards
        type: guard
        label: Request guards
        runtime: server
        description: "In order: a known route (404); a GET from another site is refused (403), since the memory and stats are personal; GET or POST only (405); an exact application/json content type (415); no cross-site Origin or Sec-Fetch-Site and the page's own x-flow-tower-voice header, so other web pages cannot spend the key or write the journal (403); a key, except for the keyless /journal and /memory (503); at most 6 requests at once across all routes, journal ones included (429); a body under the route's limit (413) and valid JSON (400)."
        limits: { concurrency: 6, description: "6 at once: a turn overlaps transcription, a streamed chat and a few sentences of speech. Body limits per route: 2 MB for a clip (~10 KB per command), 256 KB for a conversation, 8 KB for a reply, 16 KB for a journal line, 8 KB for a memory decision, 1 KB for a review request." }
        files: [src/server/voice.ts, src/server/guard.ts, tests/server-guards.test.ts]
      - id: forward
        type: process
        label: Forward to STT
        runtime: server
        description: "Checks audio as base64 and format webm, ogg, m4a, wav or mp3 (400), then sends the Bearer key, model, input_audio { data, format }, the language when Settings picks one, and provider.zdr unless turned off. Answers { text, ms, cost }."
        credentials: service
        limits: { timeout: 30s }
        files: [src/server/voice.ts]
      - id: chat
        type: process
        label: Forward to chat
        runtime: server
        description: "Checks messages (1 to 60) and tools (up to 20) (400), then sends model, messages, tools, max_tokens 500, tool_choice (none when answer is true) and provider { zdr, require_parameters }. With stream: true (what the page sends) it asks for a stream with usage and pipes the server-sent events through as they arrive (if the upstream drops after the headers went out, the response just ends); otherwise it answers { message, ms, cost }."
        credentials: service
        limits: { timeout: 30s }
        files: [src/server/voice.ts]
      - id: speech
        type: process
        label: Forward to TTS
        runtime: server
        description: "Checks a non-empty text (400), then sends model, voice, input (cut at 800 characters), response_format mp3 and provider.zdr. Answers the audio as audio/mpeg, no-store."
        credentials: service
        limits: { timeout: 30s }
        files: [src/server/voice.ts]
      - id: learn
        type: process
        label: Journal routes
        runtime: server
        description: "learningRoutes(), mounted only with a store. /journal: POST { entry } appends a turn, POST { mark } corrects its outcome, GET answers the 7-day stats. /memory: GET answers the memory and the stats, POST takes accept, reject, remove (by value) or forget; accepting a note past the cap answers 409. Both are keyless: nothing goes upstream. /review needs the key and runs one review at a time (409 for a second one)."
        files: [src/server/voice-learning.ts, src/server/voice-memory.ts, src/server/plugin.ts]
      - id: rejected
        type: output
        label: Error reply
        runtime: server
        description: "JSON { error } with the status. 502 covers an OpenRouter error status, an unreachable endpoint and the 30 s timeout, on every route that calls OpenRouter, and a review reply that cannot be read."
        files: [src/server/voice.ts]
      - id: tests
        type: tool
        label: vitest
        runtime: server
        description: "voice-server.test.ts starts the handler with a fake fetch: GET never shows the key; POST sends key, ZDR and language; an agent step with tool_choice none and require_parameters; speech as audio/mpeg; 404, 503, 415, 403 and 400 refusals. voice-journal.test.ts: the journal store (marks, 0600, forget), the routes (keyless journal, cross-site GET refused, review keeps only real aliases) and applyAliases. voice-commands.test.ts covers the parser, voice-agent.test.ts the agent-or-parser routing, voice-tools.test.ts the tools on the real dev-squad tower, voice-noise.test.ts speech against a fan and the Whisper noise list, voice-duplex.test.ts the half-duplex gate, the echo filter and barge-in; server-guards.test.ts the loader refusing secret files and the user folder."
        files: [tests/voice-server.test.ts, tests/voice-journal.test.ts, tests/voice-commands.test.ts, tests/voice-agent.test.ts, tests/voice-tools.test.ts, tests/voice-noise.test.ts, tests/voice-duplex.test.ts, tests/server-guards.test.ts]
    edges:
      - "secrets -> route [data]: key at startup"
      - "route -> guards: GET, POST"
      - "guards -> forward: / clip"
      - "guards -> chat: /chat"
      - "guards -> speech: /speak"
      - "guards -> learn: journal routes"
      - "guards -> rejected: 503 no key"
      - "guards -> rejected: 404 405 415 403 429 413 400"
      - "forward -> rejected: 400, 502"
      - "chat -> rejected: 400, 502"
      - "speech -> rejected: 400, 502"
      - "learn -> rejected: 400, 409, 502"
      - "tests -> route [call]: fake fetch"

