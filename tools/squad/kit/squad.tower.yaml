# The dev squad of this project, written by `flow-tower squad init` (#265).
# Open it with `flow-tower tools/squad/squad.tower.yaml` (or add it to your library): every squad run lights
# its node live, because run.mjs sends its events to this tower's name (`tower` in squad.json).
version: 1
name: "{{TOWER}}"
tags: [coding, multi-agent, openrouter]
limits: { max_iterations: 70, description: "The coder stops at 70 model calls per step (steps.sh), and the chain stops at the first red step." }
description: >-
  The dev squad working on this project. Your coding agent is the lead: it splits an issue into small
  steps and writes one task file per step. A cheap coder writes the code through OpenRouter, a reviewer
  and a security auditor from two other model families read the diff, the lead verifies, and you merge.

runtimes:
  laptop:
    kind: local
    label: "This computer"
    description: "The lead (your coding agent) and the squad scripts, one git worktree per issue."
  openrouter:
    kind: saas
    label: "OpenRouter"
    description: "One API in front of the coder, reviewer and security models. The key lives in the user folder, never in the repo."
    provider: "openrouter"
    url: "https://openrouter.ai"

agents:
  coder:
    runtime: openrouter
    name: Coder
    description: "Writes one step through a tool loop (read, edit, run the project's check), then reports its known gaps. Its prompt asks for the efficient approach when it adds no complexity: batches over item-by-item work, no repeated work, independent I/O run concurrently, no premature optimization."
    model: "{{CODER}}"
    files: [run.mjs, guard.mjs, args.mjs]
  reviewer:
    runtime: openrouter
    name: Reviewer
    description: Read-only review of the diff against the issue, from another model family than the coder. Runs at the same time as the security pass. Every finding quotes its line, so the merge gate can check it is real. An empty answer, or one cut short (finish_reason not stop), fails the run.
    model: "{{REVIEWER}}"
    files: [pack.mjs, oneshot.mjs, run.mjs]
  security:
    runtime: openrouter
    name: Security auditor
    description: Read-only security pass on the same diff, from a third model family. Runs at the same time as the review. Every finding quotes its line, so the merge gate can check it is real. An empty answer, or one cut short (finish_reason not stop), fails the run.
    model: "{{SECURITY}}"
    files: [pack.mjs, oneshot.mjs, run.mjs]

layers:
  - id: lead
    title: Lead
    description: Your coding agent plans, writes the task files and verifies every step.
    nodes:
      - id: issue
        type: entry
        label: Issue
        description: The work to do, split by the lead into steps of one or two items each.
      - id: lead
        type: agent
        runtime: laptop
        label: Lead
        description: "Updates the tower of the part it changes first (validated, committed), then writes one task file per step (Rules, Verify, Files), runs steps.sh in a worktree, reads the known gaps, then starts the review and the security pass together (independent, read-only requests) and waits for both. Project rules every model sees go in squad.json `rules`."
        files: [tasks/TEMPLATE.md, steps.sh, squad.json]
      - id: verify
        type: decision
        runtime: laptop
        label: Verified?
        description: "The lead runs the tests and the real thing (screenshots for UI) and checks the tower still matches the code, then opens the pull request or writes a fix step."
      - id: pr
        type: process
        runtime: laptop
        label: Pull request + CI
        description: "The branch is pushed and the pull request opened; the project's CI runs on it."
      - id: gate
        type: guard
        runtime: laptop
        label: Merge gate
        description: "Says READY or NOT READY before you merge. A script, no model, so nothing to hallucinate: CI passed, the pull request is mergeable, the worktree clean at its head, both passes approve that head commit with no critical or high finding. A finding whose quote is not at its file:line is unverified. It never merges or approves."
        files: [gate.mjs]
      - id: merge
        type: human
        label: You merge
        description: Nothing reaches the main branch without you.
      - id: main
        type: output
        label: Main branch
        description: The merged work.
    edges:
      - issue -> lead
      - "verify -> pr: green"
      - "verify -> lead [return]: fix step"
      - "pr -> gate: checks"
      - "gate -> merge: ready"
      - "gate -> lead [return]: not ready"
      - merge -> main

  - id: specialists
    title: Squad
    description: The OpenRouter models, each in its own process with its own fences.
    nodes:
      - id: coder
        agent: coder
        label: Coder
      - id: check
        type: guard
        label: Check + files
        description: After every step the project's check command must pass and every file the task lists must be touched, else the chain stops.
        files: [config.mjs, files-check.mjs]
      - id: reviewer
        agent: reviewer
        label: Reviewer
      - id: security
        agent: security
        label: Security
      - id: costs
        type: memory
        label: Cost ledger
        description: One line per run in the user folder (squad-costs.jsonl); cost.mjs sums an issue.
        files: [ledger.mjs, cost.mjs]
    edges:
      - coder -> check
      - "check -> reviewer: step commits, in parallel"
      - "check -> security: step commits, in parallel"
      - "coder -> costs [data]"

  - id: steward
    title: PR steward
    description: "One local command reviews and gates every open pull request: prs.mjs. It reads, runs the passes and the gate, and reports; it never merges, approves, comments or pushes."
    nodes:
      - id: open_prs
        type: entry
        label: Open PRs
        description: "The open pull requests (gh pr list), or the ones named with --pr."
        files: [prs.mjs]
      - id: worktree
        type: process
        runtime: laptop
        label: Worktree at head
        description: "A detached worktree at each PR head; the base is the PR's own (stacked PRs too); the brief is the PR text plus the issue it closes. A head that already has both pass outputs is skipped unless --force."
        files: [prs.mjs]
      - id: passes
        type: process
        runtime: laptop
        label: Review + security
        description: "pack.mjs and run.mjs for both roles at once, at the squad.json pace. An empty or cut answer runs once more; a second failure of the security model sends the security brief to the reviewer model."
        files: [prs.mjs, pack.mjs, run.mjs]
      - id: pr_gate
        type: guard
        runtime: laptop
        label: Gate per PR
        description: "gate.mjs on each PR: READY or NOT READY with its reasons and the unverified findings."
        files: [gate.mjs]
      - id: report
        type: output
        runtime: laptop
        label: Report
        description: "A summary table (PR, head, verdicts, findings by severity, unverified quotes, gate, cost) and the paths of the pass outputs. The worktrees are removed unless --keep."
        files: [prs.mjs]
    edges:
      - open_prs -> worktree
      - worktree -> passes
      - "passes -> pr_gate [data]: verdicts"
      - pr_gate -> report

links:
  - "steward.passes -> specialists.reviewer [spawn]: packed task"
  - "steward.passes -> specialists.security [spawn]: packed task"
  - "steward.report -> lead.lead [handoff]: verify each finding, fix steps"
  - "steward.report -> lead.merge: ready"
  - "lead.lead -> specialists.coder [spawn]: task file"
  - "specialists.reviewer -> lead.verify [return]: verdict"
  - "specialists.security -> lead.verify [return]: findings"
  - "specialists.reviewer -> lead.gate [data]: verdict + quoted findings"
  - "specialists.security -> lead.gate [data]: verdict + quoted findings"
