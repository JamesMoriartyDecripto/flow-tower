description: |
  Leafwise weiß, wann jede deiner Pflanzen Wasser braucht.

  - Erinnerungen nach Jahreszeit: Im Winter wird seltener gegossen, große Töpfe brauchen länger.
  - Widget für den Home-Bildschirm: Heute fällige Pflanzen mit einem Tipp abhaken.
  - Pflegetagebuch mit Fotos für jede Pflanze.
  - Funktioniert offline und synchronisiert später.

  Leafwise Premium schaltet Pflanzenerkennung und unbegrenzt viele Pflanzen frei. Jahresabo mit 7 Tagen gratis oder Monatsabo. Die Zahlung erfolgt über dein Store-Konto; das Abo verlängert sich automatisch, wenn es nicht mindestens 24 Stunden vor Ablauf gekündigt wird.

  Datenschutz: Kein Tracking über Apps und Websites hinweg; dein Konto kannst du in der App löschen.
