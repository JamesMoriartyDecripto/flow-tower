  # What was accepted, applied.
  - "learning.aliases -> understanding.parser [data]: aliased text"
  - "learning.aliases -> conversation.agent [data]: aliased text"
  - "learning.notes -> conversation.context [data]: approved notes"
  - "learning.chip -> actions.caption: in the caption"
  # Tests.
  - "server.tests -> understanding.parser [call]: unit tests"
  - "server.tests -> understanding.route [call]: routing cases"
  - "server.tests -> conversation.tools [call]: dev-squad tower"
