# Old-to-new article map for the testi unici that apply from 1/1/2027 (design: squad-input/design.md, section 3).
# Sources: research/primary-sources.md section 7 (MEF list, Camera dossier of 21/7/2026), checked 2026-10-15.
#
# RULE: pick the text by tax period (or by taxable event date), never by today's date.
# Periods up to 31/12/2026 cite the old sources (DPR 917/1986, DPR 633/1972, ...).
# Periods or events from 1/1/2027 cite the testo unico. Periods that straddle the change
# follow the transitional rules of each testo unico, which are not mapped here yet.
#
# Only mappings that the research notes state are recorded below. Anything else stays
# in "unmapped": the agent must say so and never guess a new article number.

