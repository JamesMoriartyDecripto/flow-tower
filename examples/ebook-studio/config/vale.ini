# Vale prose linter: house rules for The Balcony Harvest.
# Run by the style-lint hook (PostToolUse on Write/Edit) and by the copy editor:
#   vale --config config/vale.ini --output JSON chapters/06-wind.md
StylesPath = vale
MinAlertLevel = warning

[*.md]
BasedOnStyles = Balcony
# Author passages are marked in the chapter source and are never rewritten by agents.
BlockIgnores = (?s)<!-- author-verbatim -->.*?<!-- /author-verbatim -->
