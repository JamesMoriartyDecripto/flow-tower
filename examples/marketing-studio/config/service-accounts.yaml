# Service identities per platform. Names and scopes only: secrets live in Google Secret
# Manager (project tallymoor-growth, europe-west3) and are injected into tools, never prompts.
google_ads:
  identity: growth-ads@tallymoor-growth.iam.gserviceaccount.com
  auth: OAuth refresh token of the ads-automation Google user, MCC login-customer-id
  scope: https://www.googleapis.com/auth/adwords
  developer_token: secret://google-ads-developer-token   # Basic access: 15,000 ops/day
  secrets: [google-ads-refresh-token, google-ads-developer-token]
ga4:
  identity: analytics-reader@tallymoor-growth.iam.gserviceaccount.com
  scope: https://www.googleapis.com/auth/analytics.readonly
  property_role: Viewer
meta:
  identity: system user "growth-automation" in Business Manager
  permissions: [ads_read, ads_management]                  # no business_management
  secrets: [meta-system-user-token]
linkedin:
  identity: member account ads-automation@tallymoor.example (Campaign Manager role on the ad account)
  auth: 3-legged OAuth, scopes r_ads, rw_ads, r_ads_reporting   # member token, refreshed before expiry
  version_header: "202609"
  secrets: [linkedin-refresh-token]
tiktok:
  identity: TikTok for Business app "tallymoor-growth", advertiser authorization
  secrets: [tiktok-access-token, tiktok-refresh-token]
hubspot:
  identity: private app "growth-agents" for scripts; MCP via OAuth 2.1 as the marketing-ops user
  scopes: [crm.objects.contacts.write, crm.objects.companies.read, crm.objects.deals.read]
customer_io:
  identity: MCP via OAuth as lifecycle-ops user; scopes read + write (write:live disabled by admin)
  region: eu
growthbook:
  identity: personal access token of growth-pm (limited to project "marketing-site")
  secrets: [growthbook-pat]
semrush:
  identity: OAuth (API units shared with the SEO team; monthly cap alert at 80 %)
anthropic:
  secrets: [anthropic-api-key]
  workspace: growth-agents (spend limit set in the Console)
rotation: 90d
