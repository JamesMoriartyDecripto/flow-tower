description: |
  Leafwise ricorda quando ogni pianta ha bisogno d'acqua.

  - Promemoria che seguono le stagioni: in inverno si annaffia meno, i vasi grandi più di rado.
  - Widget per la schermata Home: le piante di oggi, segnate con un tocco.
  - Un diario con foto per ogni pianta.
  - Funziona offline e sincronizza dopo.

  Leafwise Premium sblocca il riconoscimento delle piante e piante illimitate. Abbonamento annuale con 7 giorni di prova gratuita o mensile. Il pagamento è addebitato sull'account dello store; l'abbonamento si rinnova automaticamente se non viene disdetto almeno 24 ore prima della scadenza.

  Privacy: nessun tracciamento tra app e siti; puoi eliminare l'account dall'app.
