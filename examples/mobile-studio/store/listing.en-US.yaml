description: |
  Leafwise remembers when each of your plants needs water, so you don't have to.

  - Reminders that follow the seasons: watering intervals stretch in winter and adapt to pot size.
  - A widget for your Home Screen: see what's due today and mark it watered with one tap.
  - A care journal for every plant, with photos.
  - Works offline; syncs when you're back online.

  Leafwise Premium unlocks plant identification and unlimited plants. Annual plan with a 7-day free trial, or monthly. Payment is charged to your store account; the subscription renews automatically unless cancelled at least 24 hours before the end of the period. Manage or cancel it in your account settings.

  Privacy: we don't track you across apps and websites, and you can delete your account in the app.
