# Source registry: every source the system may retrieve or cite, with its legal weight.
# Read by the sources.sync process (towers/sources.tower.yaml) and by the citation guards.
# Verified on 2026-10-15 from squad-input/sites-it.md and research/primary-sources.md.
#
# Weight scale (strongest first): law > practice > case-law > standard > guidance > data > press.
# Use the weight as the citation rule: only law, practice, case-law and standard may support a claim;
# guidance and data are informational; press is never cited as authority.
#
# Rule: press is a lead only. Follow it to the primary text, never cite it as authority.
# The Gazzetta Ufficiale text prevails over Normattiva (Normattiva says its texts are not official).
#
# Each entry: id (kebab-case), name, url (exactly as in the inputs), kind (a weight below),
# access (free | login-spid | entratel | paid | open-data), api (short), topics, note (how to cite,
# or a verification flag). An URL marked unverified in the inputs is flagged in note.

weights:
  law: "binding on taxpayers and the administration: statutes, decrees with force of law, codes, EU law, regulator rules."
  practice: binds the administration only (circolari, risoluzioni, interpelli, prassi). Relying on it protects from penalties (L. 212/2000 art. 10 c. 2); an interpello reply binds only for that applicant and question (art. 11 c. 5).
  case-law: judgments and orders. Cassation and EU courts carry strong weight; merit decisions are persuasive only.
  standard: technical accounting or professional standards (e.g. OIC principles) that interpret the law.
  guidance: official pages, FAQs, portal descriptions. Informational, never the cited authority.
  data: registers, databases, open-data feeds and APIs. Used to retrieve facts, cited through their own weight.
  press: secondary sources (trade press, magazines, professional firms). A lead only, never cited as authority.

