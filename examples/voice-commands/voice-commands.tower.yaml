  - "understanding.bargein -> conversation.speak [call]: stopSpeaking"
  - "capture.esc -> conversation.speak [call]: stopSpeaking"
  - "conversation.speak -> capture.duplex [data]: playback spans"
  - "conversation.speak -> understanding.echo [data]: reply words"
  - "understanding.route -> conversation.agent: question"
  # Parser to action.
