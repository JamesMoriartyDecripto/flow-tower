# Dev Squad on a single VPS: one container runs the webhook receiver (src/main.ts serve),
# the pipeline, the lead and every subagent. The VPS's TLS proxy forwards https://<host>/github here.
services:
  squad:
    image: ghcr.io/example-org/dev-squad:${SQUAD_TAG:-latest}
    restart: unless-stopped
    command: ["npx", "tsx", "src/main.ts", "serve", "--port", "8787"]
    ports:
      - "127.0.0.1:8787:8787"                   # only the local TLS proxy reaches it
    env_file: /srv/dev-squad/secrets.list      # ANTHROPIC_API_KEY, GITHUB_TOKEN, GITHUB_WEBHOOK_SECRET, CONTEXT7_API_KEY, SEMGREP_APP_TOKEN
    environment:
      SQUAD_MAX_PARALLEL_ISSUES: "2"
    volumes:
      - worktrees:/tmp/dev-squad/worktrees
      - ./logs:/app/logs
volumes:
  worktrees:
