name: Bug report
description: Something in Flow Tower does not work as documented
labels: ["bug"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: tower
    attributes:
      label: Minimal tower file
      description: The smallest tower file that shows the problem. Remove anything private.
      render: yaml
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ...\n2. Open ...\n3. See ..."
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flow Tower version
      description: Output of `flow-tower --version`
    validations:
      required: true
