status: >-
  Official correspondence tables (tabelle di concordanza) were NOT published as of 2026-10-15.
  The notes say Agenzia delle Entrate, Sogei and the Dipartimento Finanze are still building them.
  Until they are published, article-level mappings stay empty.

replaces_note: >-
  The "replaces" lists are indicative, taken from the research notes (primary-sources.md, section 7).
  They are not a legal concordance.

