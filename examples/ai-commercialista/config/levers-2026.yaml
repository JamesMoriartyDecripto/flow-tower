    who: "business-income subjects with taxable profit; not companies in crisis or under D.Lgs. 231/2001 bans"
    size: "cost uplift for depreciation/leasing: +180% up to EUR 2.5 m, +100% from 2.5 to 10 m, +50% from 10 to 20 m"
    source: "L. 199/2025 art. 1 c. 427-436; DL 38/2026 art. 7 conv. L. 88/2026"
    status: active
    window: "investments 1/1/2026 - 30/9/2028; completion by 15/11/2028"
    url: "https://www.mimit.gov.it/it/incentivi/piano-transizione-5-0"
    confidence: medium
    abuse_risk_default: green
    notes: "rates H; procedure dates M (§2.1). Brackets annual or cumulative: not stated in the law. CPB adherents: mechanism worded differently by sources (verify text). GSE platform; DM date 4 or 7 May 2026 unverified. Not cumulable with the 4.0 credit on the same goods."

