# yaml-language-server: $schema=../../schema/flow-tower.schema.json
version: 1
name: AI Co-Scientist
tags: [science, research, multi-agent, gemini, self-improving]
description: >-
  Google's AI co-scientist, a Gemini-based multi-agent system that acts as a virtual
  scientific collaborator. A scientist's goal becomes an approved research plan; a
  Supervisor fills an asynchronous worker queue with Generation, Reflection, Ranking
  (Elo tournament), Evolution, Proximity and Meta-review tasks. The loop runs for
  hours to days, improves itself through meta-review feedback, and keeps the
  scientist in the loop. Available in Gemini Enterprise (allowlisted access).

runtimes:
  enterprise:
    kind: saas
    label: "Gemini Enterprise"
    description: "Where scientists start sessions, approve plans, chat, add reviews and their own hypotheses. Access is restricted."
    provider: "google"
    url: "https://docs.cloud.google.com/gemini/enterprise/docs/co-scientist-and-alphaevolve"
  backend:
    kind: cloud
    label: "Co-scientist backend"
    description: "Supervisor and a pool of asynchronous worker processes; state snapshots on persistent storage."
    provider: "google-cloud"
  gemini:
    kind: saas
    label: "Gemini API"
    description: "Gemini models with Grounding with Google Search, plus embeddings."
    provider: "google"
    url: "https://ai.google.dev"
  databases:
    kind: saas
    label: "Domain databases"
    description: "Constrain closed-space goals: approved-drug lists, DepMap dependencies, trial registries."
    url: "https://depmap.org"
  alphafold:
    kind: saas
    label: "AlphaFold"
    description: "Specialised model the paper names as a possible feedback source for structural hypotheses."
    provider: "google-deepmind"
    url: "https://alphafold.ebi.ac.uk"

prompts:
  goal-parser: { file: prompts/goal-parser.md, description: "Goal -> research plan configuration (criteria, constraints, format)." }
  supervisor: { file: prompts/supervisor.md, description: "Statistics -> agent weights, priority tasks, terminal state." }
  generation: { file: prompts/generation.md, description: "Literature, simulated debate, assumptions, research expansion." }
  reflection: { file: prompts/reflection.md, description: "Initial, full, deep verification, observation, simulation, tournament reviews." }
  ranking: { file: prompts/ranking.md, description: Pairwise single-turn comparison or multi-turn debate. }
  evolution: { file: prompts/evolution.md, description: "Grounding, feasibility, inspiration, combination, simplification, out-of-box." }
  proximity: { file: prompts/proximity.md, description: Goal-aware similarity and duplicate detection. }
  meta-review: { file: prompts/meta-review.md, description: Feedback for other agents + research overview. }
  safety: { file: prompts/safety.md, description: Safety review of goals and hypotheses. }

agents:
  parser:
    name: Goal parser
    description: Parses the natural-language goal into a research plan configuration the scientist reviews.
    model: gemini-2.0-flash
    prompt: goal-parser
    runtime: backend
    files: [src/research_session.py, config/research_plan.yaml]
  supervisor:
    name: Supervisor
    description: Builds the task queue, weights agents from summary statistics, detects the terminal state. Never writes hypotheses.
    model: gemini-2.0-flash
    prompt: supervisor
    runtime: backend
    files: [src/supervisor_loop.py, config/agent_weights.yaml]
    budget: { tokens: 400000000, on_exceed: pause }
    limits: { ttl: 72h, max_iterations: 400, concurrency: 32, timeout: 15m }
    resources:
      - { kind: log, label: "Supervisor log", path: "logs/supervisor.log" }
  generation:
    name: Generation
    description: Searches literature, simulates expert debates, chains testable assumptions, expands into unexplored directions.
    model: gemini-2.0-flash
    prompt: generation
    tools: [google_search]
    runtime: backend
    files: [src/specialists.py]
    trigger: { kind: queue, source: supervisor task queue }
  reflection:
    name: Reflection
    description: Peer reviewer. Initial filter, full review with search, deep verification of assumptions, observation and simulation reviews.
    model: gemini-2.0-flash
    prompt: reflection
    tools: [google_search]
    runtime: backend
    files: [src/specialists.py]
    trigger: { kind: queue, source: supervisor task queue }
  ranking:
    name: Ranking
    description: Elo tournament. Multi-turn debates among top hypotheses, single-turn comparisons below.
    model: gemini-2.0-flash
    prompt: ranking
    runtime: backend
    files: [src/specialists.py, src/elo_tournament.py]
    tower: towers/tournament.tower.yaml
    trigger: { kind: queue, source: supervisor task queue }
    resources:
      - { kind: log, label: "Tournament log", path: "logs/tournament.log" }
  evolution:
    name: Evolution
    description: Produces NEW hypotheses from top-ranked ones; originals stay and must keep winning.
    model: gemini-2.0-flash
    prompt: evolution
    tools: [google_search]
    runtime: backend
    files: [src/specialists.py]
    trigger: { kind: queue, source: supervisor task queue }
  proximity:
    name: Proximity
    description: Goal-aware similarity graph for clustering, de-duplication and tournament pairing.
    model: gemini-2.0-flash
    prompt: proximity
    runtime: backend
    files: [src/proximity_graph.py]
    trigger: { kind: queue, source: supervisor task queue }
  meta:
    name: Meta-review
    description: Turns recurring review and debate patterns into prompt feedback, and writes the research overview.
    model: gemini-2.0-flash
    prompt: meta-review
    runtime: backend
    files: [src/specialists.py]
    trigger: { kind: queue, source: supervisor task queue }

layers:
  # 1 ───────────────────────────────────────────────────────────────
  - id: scientist
    title: Scientist in the Loop
    description: The scientist sets the goal, approves the plan, and can steer at any time.
    nodes:
      - id: goal
        type: entry
        runtime: enterprise
        label: Research goal
        description: A goal in natural language, optionally with papers or data the scientist attaches.
        trigger: { kind: chat, source: Gemini Enterprise }
        data: { sensitivity: confidential, description: "Unpublished research directions and lab data." }
        files: [src/research_session.py]
      - id: goal_safety
        type: guard
        runtime: backend
        label: Goal safety
        description: Rejects goals that could enable serious harm. Tested on 1,200 adversarial goals in the paper.
        prompt: safety
        files: [prompts/safety.md, src/research_session.py]
        evals:
          - { name: adversarial goals blocked, value: 1.0, target: 1.0, description: "Paper: all 1,200 adversarial goals across 40 topics were rejected." }
      - id: parser
        agent: parser
      - id: approve
        type: human
        runtime: enterprise
        label: Approve plan
        description: The scientist reviews the research plan configuration and edits criteria or constraints before compute is spent.
        approval: { by: scientist, via: Gemini Enterprise, actions: [approve, edit, reject], timeout: 7d, on_timeout: wait }
        files: [config/research_plan.yaml]
      - id: plan_config
        type: memory
        runtime: backend
        label: Plan config
        description: Criteria and preferences reused by every agent and by auto-evaluation.
        files: [config/research_plan.yaml]
      - id: steer
        type: human
        runtime: enterprise
        label: Scientist input
        description: Chat, manual reviews, own hypotheses (they join the tournament), pointers to specific papers.
        approval: { by: scientist, via: Gemini Enterprise, actions: [respond, edit], on_timeout: wait }
      - id: rejected
        type: output
        runtime: enterprise
        label: Goal rejected
        description: The reason is returned; nothing is queued.
    edges:
      - goal -> goal_safety
      - "goal_safety -> parser: allowed"
      - "goal_safety -> rejected: unsafe"
      - "parser -> approve [handoff]: plan YAML"
      - "approve -> plan_config [data]: approved"
      - "approve -> parser [return]: edit"

  # 2 ───────────────────────────────────────────────────────────────
  - id: supervisor
    title: Supervisor & Worker Queue
    description: Asynchronous task execution. Compute scales with workers; state survives restarts.
    nodes:
      - id: supervisor
        agent: supervisor
      - id: stats
        runtime: backend
        label: Summary stats
        description: Pool size, review outcomes, Elo distribution, matches played, pending scientist input.
        files: [src/supervisor_loop.py]
      - id: weights
        runtime: backend
        label: Agent weights
        description: Share of the next batch per agent. Generation early; ranking and evolution as the pool grows.
        files: [config/agent_weights.yaml]
      - id: queue
        runtime: backend
        label: Task queue
        description: Bounded async queue. Scientist input is enqueued before weighted tasks.
        trigger: { kind: queue, source: supervisor }
        resources:
          - { kind: queue, label: "Task queue config", path: "config/agent_weights.yaml" }
        files: [src/supervisor_loop.py]
      - id: workers
        runtime: backend
        label: Worker pool
        description: Each worker pulls one task and runs one specialised agent. A failed task is logged, never fatal.
        fanout: { min: 8, max: 32, by: supervisor weights and budget }
        limits: { concurrency: 32, timeout: 15m, retries: 1 }
        files: [src/supervisor_loop.py]
      - id: terminal
        type: decision
        runtime: backend
        label: Terminal state?
        description: Top-10 Elo stable for 12 cycles, budget spent, or the scientist stops the session.
        limits: { max_iterations: 400 }
        files: [config/agent_weights.yaml]
      - id: context
        type: memory
        runtime: backend
        label: Context memory
        description: Periodic snapshot of the whole state. Feedback channel across iterations and restart point after failures.
        data: { sensitivity: confidential, retention: 180d }
        files: [src/context_memory.py]
    edges:
      - "stats -> supervisor [data]: statistics"
      - "supervisor -> weights: allocate"
      - { from: weights, to: queue, kind: flow, label: batch of 64, protocol: queue }
      - { from: queue, to: workers, kind: spawn, label: next task, protocol: queue }
      - "workers -> context [data]: results"
      - "context -> stats [data]: snapshot"
      - "supervisor -> terminal: each cycle"
      - "terminal -> weights [return]: continue"

  # 3 ───────────────────────────────────────────────────────────────
  - id: generate
    title: Generate & Review
    description: New hypotheses are generated, safety-checked and peer-reviewed before they may compete.
    nodes:
      - id: generation
        agent: generation
      - id: hyp_safety
        type: guard
        runtime: backend
        label: Hypothesis safety
        description: Every new hypothesis is screened; unsafe ones never reach the tournament.
        prompt: safety
        files: [src/specialists.py]
      - id: initial
        agent: reflection
        label: Initial review
        description: Fast filter without tools — correctness, obvious novelty, relevance, preliminary safety.
      - id: pass_initial
        type: decision
        runtime: backend
        label: Passes?
        description: reject drops the hypothesis; pass and revise enter the pool at 1200 Elo.
        files: [src/specialists.py]
      - id: deep_review
        agent: reflection
        label: Deep reviews
        description: Full review with search, deep verification of sub-assumptions, observation and simulation reviews.
      - id: pool
        type: memory
        runtime: backend
        label: Hypothesis pool
        description: Hypotheses with their reviews, parents, cluster and Elo.
        files: [src/context_memory.py]
      - id: dropped
        type: output
        runtime: backend
        label: Dropped
        description: Rejected or unsafe hypotheses, kept in the log for meta-review.
    edges:
      - "generation -> hyp_safety: 1-3 hypotheses"
      - "hyp_safety -> initial: allowed"
      - "hyp_safety -> dropped: unsafe"
      - "initial -> pass_initial [data]: verdict"
      - "pass_initial -> pool [data]: pass, 1200 Elo"
      - "pass_initial -> dropped: reject"
      - "pool -> deep_review: queued reviews"
      - "deep_review -> pool [data]: reviews"

  # 4 ───────────────────────────────────────────────────────────────
  - id: tournament
    title: Tournament & Evolution
    description: Test-time compute goes into debate, ranking and evolution; meta-review closes the self-improvement loop.
    nodes:
      - id: proximity
        agent: proximity
      - id: graph
        type: memory
        runtime: backend
        label: Proximity graph
        description: Similarity edges; pairs similar hypotheses in matches and clusters directions in the overview.
        files: [src/proximity_graph.py]
      - id: ranking
        agent: ranking
        label: Elo tournament
        evals:
          - { name: GPQA diamond top-1 (top Elo), value: 0.784, target: 0.75, description: "Value reported in the paper for the top-Elo answer per question; target illustrative." }
          - { name: top hypothesis Elo, value: 1512, target: 1450, description: "Illustrative, from logs/tournament.log; Elo is an auto-evaluation, not ground truth." }
      - id: elo
        type: memory
        runtime: backend
        label: Elo table
        description: Ratings start at 1200; K = 32.
        files: [src/elo_tournament.py, logs/tournament.log]
      - id: evolution
        agent: evolution
      - id: meta
        agent: meta
        evals:
          - { name: expert preference rank, value: 2.36, target: 2.5, higher_is_better: false, description: "Paper: average rank across 11 goals (1 best, 4 worst); target illustrative." }
          - { name: "novelty (expert, 1-5)", value: 3.64, target: 3.5, description: "Paper value; target illustrative." }
          - { name: "impact (expert, 1-5)", value: 3.09, target: 3.0, description: "Paper value; target illustrative." }
      - id: feedback
        type: memory
        runtime: backend
        label: Prompt feedback
        description: Meta-review findings appended to generation, reflection and evolution prompts. Improvement without fine-tuning.
        files: [src/specialists.py, prompts/meta-review.md]
    edges:
      - "proximity -> graph [data]: edges, clusters"
      - "graph -> ranking [data]: similar pairs"
      - "ranking -> elo [data]: match result"
      - "elo -> evolution [data]: top-ranked"
      - "elo -> meta [data]: ranking"
      - "meta -> feedback [data]: patterns"
      - "feedback -> evolution [data]: apply"

  # 5 ───────────────────────────────────────────────────────────────
  - id: tools
    title: Tools, Models & Outputs
    description: Web search is the primary tool; domain databases and specialised models ground closed-space goals.
    nodes:
      - id: search
        type: tool
        runtime: gemini
        label: Google Search
        description: Grounding with Google Search for literature exploration, full reviews and evolution.
        tools: [google_search]
        files: [src/cosci_llm.py]
      - id: domain_db
        type: tool
        runtime: databases
        label: Domain databases
        description: Approved-drug lists, DepMap dependency scores, trial registries. Bound closed-space goals.
        credentials: service
        files: [config/research_plan.yaml]
      - id: private_lit
        type: tool
        runtime: backend
        status: experimental
        label: Private papers
        description: An indexed private publication repository, when the lab provides one.
        credentials: user
      - id: alphafold
        type: tool
        runtime: alphafold
        status: experimental
        label: AlphaFold
        description: Structure predictions as feedback on mechanism hypotheses that involve protein binding.
      - id: gemini
        type: model
        runtime: gemini
        label: Gemini 2.0
        model: gemini-2.0-flash
        description: The paper runs every agent on Gemini 2.0 and calls the framework model-agnostic. The variant id here is a placeholder.
      - id: embed
        type: model
        runtime: gemini
        label: Gemini embeddings
        model: gemini-embedding-001
        description: Cheap neighbour shortlist before the Proximity agent judges similarity (this example's reconstruction).
        files: [src/proximity_graph.py]
      - id: overview
        type: output
        runtime: enterprise
        label: Research overview
        description: Ranked directions, hypotheses, discriminating experiments, expert fields to consult; optionally NIH Specific Aims pages.
        files: [outputs/specific-aims-example.md]
      - id: lab
        type: human
        runtime: enterprise
        label: Wet-lab validation
        description: Scientists test top hypotheses (e.g. AML repurposing candidates in cell lines). Results can seed a new session.
        sla: 12w
    edges:
      - "overview -> lab [handoff]: top hypotheses"

links:
  - "scientist.plan_config -> supervisor.supervisor [handoff]: start session"
  - "scientist.steer -> supervisor.queue [data]: inbox first"
  - "supervisor.workers -> generate.generation [spawn]: generation task"
  - "supervisor.workers -> generate.deep_review [spawn]: review task"
  - "supervisor.workers -> tournament.ranking [spawn]: match task"
  - "supervisor.workers -> tournament.evolution [spawn]: evolution task"
  - "supervisor.workers -> tournament.meta [spawn]: every 10 cycles"
  - "generate.pool -> tournament.proximity [data]: new hypothesis"
  - "tournament.evolution -> generate.hyp_safety [return]: new hypothesis"
  - "tournament.feedback -> generate.generation [data]: prompt feedback"
  - "tournament.elo -> supervisor.stats [data]: Elo distribution"
  - "supervisor.terminal -> tools.overview [handoff]: terminal"
  - "tournament.meta -> tools.overview [data]: overview"
  - "tools.overview -> scientist.steer [return]: review results"
  - "generate.generation -> tools.search [call]: literature"
  - "generate.deep_review -> tools.search [call]: verify"
  - "generate.generation -> tools.domain_db [call]: candidates"
  - "generate.deep_review -> tools.alphafold [call]: structure check"
  - "generate.generation -> tools.private_lit [call]: lab papers"
  - "tournament.ranking -> tools.gemini [call]: debate"
  - "tournament.proximity -> tools.embed [call]: shortlist"
  - "scientist.goal_safety -> tools.gemini [call]"
