# yaml-language-server: $schema=../../../schema/flow-tower.schema.json
version: 1
name: Marketing & launch
description: >-
  Competitor insight -> positioning -> website, trailer, store page and social in parallel ->
  brand review (max 2 rounds) -> human publish approval -> launch and community loop.
root: ..

prompts:
  marketing-lead: { file: prompts/marketing-lead.md }
  positioning: { file: prompts/positioning.md }
  web-developer: { file: prompts/web-developer.md }
  trailer-writer: { file: prompts/trailer-writer.md }
  store-page-writer: { file: prompts/store-page-writer.md }
  community-manager: { file: prompts/community-manager.md }
  creative-director: { file: prompts/creative-director.md }

agents:
  lead:
    name: Marketing lead
    model: claude-sonnet-5-5
    prompt: marketing-lead
    tools: [Agent, Read, Write, WebSearch, mcp__analytics__query_insights]
    files: [src/departments/marketing.ts]
  analyst:
    from: .claude/agents/market-analyst.md
  web:
    name: Web developer
    model: claude-sonnet-5-5
    prompt: web-developer
    tools: [Read, Write, Edit, Bash, mcp__figma__get_variable_defs]
  trailer:
    name: Trailer writer
    model: claude-sonnet-5-5
    prompt: trailer-writer
    tools: [Read, Write]
  store:
    name: Store page writer
    model: claude-sonnet-5-5
    prompt: store-page-writer
    tools: [Read, Write, WebSearch]
  community:
    name: Community manager
    model: claude-sonnet-5-5
    prompt: community-manager
    tools: [Read, Write, mcp__analytics__query_insights]
  cd:
    name: Creative director
    model: claude-opus-5-5
    prompt: creative-director
    tools: [Read]

layers:
  - id: insight
    title: Insight & Positioning
    description: Know the shelf before writing a word. Every claim in the copy traces back to this layer.
    nodes:
      - id: report
        type: entry
        label: Market report
        description: From the research department; comps, price bands, review sentiment, wishlist proxies.
        files: [memory/competitors.md]
      - id: lead
        agent: lead
      - id: analyst
        agent: analyst
        label: Comp teardown
        description: Store pages and trailers of the top 6 comps - hooks, first 5 seconds, tag sets.
      - id: positioning
        label: Positioning
        description: One-line hook, audience segments, three differentiators.
        prompt: positioning
        model: claude-sonnet-5-5
      - id: pillars
        type: memory
        label: Pillars & tone
        files: [memory/art-bible.md, config/style-guide.json]
    edges:
      - "report -> lead [data]: insights"
      - "lead -> analyst [spawn]: teardown"
      - "analyst -> positioning [return]: hooks"
      - "pillars -> positioning [data]: tone"

  - id: assets
    title: Campaign Assets (parallel)
    description: Four branches from one positioning brief. Captures come from Sequencer shots in the real build.
    nodes:
      - id: website
        agent: web
        label: Website
      - id: press_kit
        label: Press kit
        description: Fact sheet, logo pack, 10 screenshots, GIFs, contact. Generated next to the site.
      - id: trailer
        agent: trailer
        label: Trailer script
      - id: capture
        label: Trailer capture
        description: Movie Render Queue renders of the scripted Sequencer shots at 4K.
        files: [pipelines/unreal/sequencer_shots.py]
      - id: store
        agent: store
        label: Store page
      - id: capsule
        type: tool
        label: Capsule art
        description: Key art variations generated then painted over; licence record attached.
        tools: [mcp__imagegen__generate_image]
        files: [.mcp.json]
    edges:
      - "website -> press_kit [data]: brand tokens"
      - "trailer -> capture [call]: shot list"
      - "store -> capsule [call]: capsule brief"

  - id: campaign
    title: Campaign & Approval
    description: Brand review by the creative director (max 2 rounds), then nothing goes public without a human.
    nodes:
      - id: social
        agent: community
        label: Social posts
      - id: calendar
        label: Content calendar
        description: 6 weeks to launch, beats tied to Steam Next Fest and the trailer drop.
      - id: brand
        agent: cd
        label: Brand review
      - id: on_brand
        type: decision
        label: On brand?
      - id: approval
        type: human
        label: Publish approval
        description: Drafts only until approved. The publish tools are on the settings.json ask list.
        files: [src/tools/request-approval.ts, .claude/settings.json]
    edges:
      - "social -> calendar [data]: posts"
      - "calendar -> brand [handoff]: campaign"
      - "brand -> on_brand [data]: verdict"
      - "on_brand -> approval [handoff]: yes"

  - id: launch
    title: Launch & Community
    description: Measure, listen, route feedback back into the studio.
    nodes:
      - id: live
        type: output
        label: Store page live
        description: Coming-soon page with trailer, wishlist button, Discord link.
      - id: wishlists
        type: tool
        label: Wishlist metrics
        tools: [mcp__analytics__query_insights]
        files: [.mcp.json]
      - id: community
        agent: community
        label: Community digest
        description: Weekly Discord/Reddit digest - top requests, bugs, sentiment.
      - id: feedback
        type: output
        label: Feedback to studio
        description: Bugs to QA triage, design requests to the game designer, insights to memory.
        files: [memory/playtest-insights.md]
    edges:
      - "live -> wishlists [data]: traffic"
      - "wishlists -> community [data]: trends"
      - "community -> feedback: digest"

links:
  - "insight.positioning -> assets.website [spawn]: hook"
  - "insight.positioning -> assets.trailer [spawn]: key moments"
  - "insight.positioning -> assets.store [spawn]: features"
  - "insight.positioning -> campaign.social [spawn]: beats"
  - "assets.press_kit -> campaign.brand [return]: site"
  - "assets.capture -> campaign.brand [return]: trailer"
  - "assets.capsule -> campaign.brand [return]: store page"
  - "campaign.on_brand -> insight.lead [return]: rework"
  - "campaign.approval -> launch.live: publish"
  - "launch.feedback -> insight.lead [data]: learnings"
