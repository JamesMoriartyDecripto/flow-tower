  - "conversation.agent -> actions.caption: error"
  - "conversation.tools -> actions.store [call]: same as keys"
  - "conversation.step -> actions.caption: answer"
  - "conversation.step -> actions.idle: answer, re-arm"
  # The spoken reply.
  - { from: conversation.speak, to: server.route, kind: call, protocol: http, label: POST /speak }
  - { from: server.speech, to: conversation.tts, kind: call, protocol: http, label: text + voice }
  - "conversation.tts -> server.speech [return]: mp3"
  - "server.speech -> conversation.speak [return]: audio/mpeg"
  - "conversation.speak -> actions.caption: playback blocked"
  - "actions.off -> conversation.speak [call]: stop audio"
  # Learning: turns and outcomes into the journal, through the server.
  - "actions.execute -> learning.record [data]: parser turn"
  - "conversation.step -> learning.record [data]: agent turn"
  - "conversation.agent -> learning.record [data]: agent error"
  - "understanding.bargein -> learning.marks [call]: interrupted"
  - "capture.esc -> learning.marks [call]: interrupted"
  - "understanding.route -> learning.marks [call]: next words"
  - { from: learning.record, to: server.route, kind: call, protocol: http, label: POST /journal }
  - { from: learning.marks, to: server.route, kind: call, protocol: http, label: POST mark }
  - { from: learning.panel, to: server.route, kind: call, protocol: http, label: /memory }
  - { from: learning.due, to: server.route, kind: call, protocol: http, label: POST /review }
  - "server.learn -> learning.journal [data]: append 0600"
  - "server.learn -> learning.memory [data]: read, save"
  - "server.learn -> learning.review [call]: /review"
  - "actions.off -> learning.due: mic off"
  # The review goes to the same chat model, structured output.
