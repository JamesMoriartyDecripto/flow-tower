<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greeting</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- Stranger greeting is the default; greet.js replaces it when ?name= is present. -->
      <h1 id="greeting">Hello, stranger!</h1>
    </main>
    <!-- Classic script (not type="module") so the page also works from file:// without a server. -->
    <script src="greet.js"></script>
  </body>
</html>
