# yaml-language-server: $schema=../../schema/flow-tower.schema.json
# Canonical Dev Squad (#355): one engine, the Node runner in tools/squad, on one OpenRouter key.
# The lead is the user's own session in any skill-capable harness; no SDK, no Claude account.
# squad init installs this tower as tools/squad/squad.tower.yaml with its bundle under tools/squad/dev-squad/.
# The role node ids below are the ones tools/squad/roles.mjs posts live events to: keep them stable.
version: 1
name: Dev Squad
tags: [coding, openrouter, multi-agent, harness-agnostic]
limits: { concurrency: 2, description: "The lead decides what runs at once. Reviewer and security start together (both read-only); coder steps run one at a time per worktree." }
description: >-
  A coding squad that works your GitHub issues on one OpenRouter key. Your current session
  (Claude Code, Codex, Pi, Hermes, Cursor…) is the lead: it plans, writes the task files and
  verifies. Specialists (triage, architect, researcher, coder, tester, doc writer, reviewer,
  security, verifier) run through the Node runner in tools/squad, each on the model its
  squad.json names. A maintainer merges.

runtimes:
  laptop:
    kind: local
    label: "Your machine"
    description: "The lead session, the runner scripts (Node 22, git) and the worktrees. Nothing is deployed."
  github:
    kind: saas
    label: "GitHub"
    description: "Issues, pull requests and CI."
    provider: "github"
    url: "https://github.com/example-org/app"
  openrouter:
    kind: saas
    label: "OpenRouter"
    description: "One OpenAI-style API, one key, every model family: each specialist role runs here."
    provider: "openrouter"
    url: "https://openrouter.ai"

prompts:
  task-template:
    file: task-template.md
    description: "The shape of one step: rules, files to read, why, numbered items, the Files: line the runner checks."

agents:
  lead:
    runtime: laptop
    name: Lead (your session)
    description: "Your own coding agent, in any harness that loads skills. It follows the flow-tower-squad skill: issue, tower, plan, task files, runs the specialists, verifies everything itself, opens the PR. It never merges."
    model: your-harness-model
    harness: { provider: any, skill: flow-tower-squad }
    files: [README.md]
    meta: { pattern: orchestrator-workers }
  triage:
    runtime: laptop
    name: Triage
    description: "Read-only classifier: route full / needs_info / reject and the areas touched."
    model: anthropic/claude-haiku-5.5
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true }
    files: [roles/triage.md]
    meta: { pattern: routing }
  architect:
    runtime: laptop
    name: Architect
    description: "Read-only planner: criteria, open questions, ordered steps with their Files: lines."
    model: openai/gpt-6.1-terra
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true }
    files: [roles/architect.md]
    meta: { default_model: openai/gpt-6.1-terra, why: "default in squad.json since #320: 9/9 plans at 1.8 cents in the #362 benchmark" }
  lead-judge:
    runtime: laptop
    name: Lead judge
    description: "#320. Read-only: keeps or drops each review finding with a reason, as the lead does by hand today. Kept findings become fix steps."
    model: anthropic/claude-sonnet-5.5
    harness: { provider: openrouter, runner: run.mjs, mode: oneshot, read_only: true }
    files: [roles/lead-judge.md]
    meta: { why: "the only model with 9/9 on real review findings in the #362 benchmark, about 2.7 cents per round" }
  researcher:
    runtime: laptop
    name: Researcher
    description: "Read-only: answers the plan's open questions with file:line citations."
    model: z-ai/glm-5.3-flash
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true }
    files: [roles/researcher.md]
  coder:
    runtime: laptop
    name: Coder
    description: "Implements one step in a tool loop with the minimum the task needs, writes only the step's folders, runs the checks, ends with Known gaps."
    model: anthropic/claude-haiku-5.5
    tower: towers/runner-loop.tower.yaml
    harness: { provider: openrouter, runner: steps.sh, mode: loop, max_steps: 70 }
    sandbox: { network: open, filesystem: workspace }
    files: [roles/coder.md, task-template.md]
  tester:
    runtime: laptop
    name: Tester
    description: "Runs the project's existing checks and reports; writes nothing."
    model: anthropic/claude-haiku-5.5
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true }
    files: [roles/tester.md]
  doc-writer:
    runtime: laptop
    name: Doc writer
    description: "Writes only the doc folders given with --write: CHANGELOG, README, docs."
    model: anthropic/claude-haiku-5.5
    harness: { provider: openrouter, runner: run.mjs, mode: loop }
    files: [roles/doc-writer.md]
  reviewer:
    runtime: laptop
    name: Reviewer
    description: "One packed request, JSON verdict only. Another model family than the coder's. Flags bugs and unneeded complexity: code the brief does not ask for, duplicates, oversized solutions."
    model: z-ai/glm-5.3-flash
    harness: { provider: openrouter, runner: run.mjs, mode: oneshot, read_only: true }
    files: [roles/reviewer.md]
    meta: { pattern: evaluator-optimizer, role: evaluator, cross_model: "GLM reviews Haiku's code" }
  security:
    runtime: laptop
    name: Security auditor
    description: "One packed request, JSON verdict with severities; falls back to the reviewer's model on an empty answer. Names the existing guard before proposing a new check."
    model: deepseek/deepseek-v4.1-flash
    harness: { provider: openrouter, runner: run.mjs, mode: oneshot, read_only: true }
    files: [roles/security.md]
  verifier:
    runtime: laptop
    name: Verifier
    description: "Fresh context: the criteria and the branch, PASS or HOLD per criterion with evidence."
    model: z-ai/glm-5.3-flash
    harness: { provider: openrouter, runner: run.mjs, mode: loop, read_only: true, context: fresh }
    files: [roles/verifier.md]

layers:
  # 1 ───────────────────────────────────────────────────────────────
  - id: intake
    title: Intake & Triage
    description: "You pick the issue and ask your session to work it with the squad. Triage proposes a route; the lead decides."
    nodes:
      - id: issue
        runtime: github
        type: entry
        label: GitHub issue
        description: "The live record: the plan, each step's status, review findings kept or dropped and why, the squad cost when it closes."
        files: [README.md]
      - id: lead
        agent: lead
        label: Lead
      - id: triage
        agent: triage
        label: Triage
      - id: route
        runtime: laptop
        type: decision
        label: Route?
        description: "Triage proposes, the lead decides. Every change takes the full path (a trivial one gets a one-step plan); a sensitive area named in the title, body or areas needs the maintainer's plan sign-off."
        decision: { output: choice, candidates: [full, needs_info, reject], fail: closed }
        files: [roles/triage.md]
      - id: needs_info
        runtime: github
        type: output
        label: Ask reporter
        description: "needs_info: the lead comments the questions; reject: the reason. No branch is created."
        files: [roles/triage.md]
    edges:
      - "issue -> lead: work #n with the squad"
      - "lead -> triage [spawn]: issue text as data"
      - "triage -> route [data]: route, areas"
      - { from: route, to: needs_info, label: unclear, condition: "route in [needs_info, reject]" }

  # 2 ───────────────────────────────────────────────────────────────
  - id: orchestration
    title: Plan & Steps
    description: "Towers before code: the lead updates the tower of the part it changes, then plans and writes one task file per step."
    nodes:
      - id: branch
        runtime: laptop
        label: Feature branch
        description: "One branch per issue from an up-to-date main, in the existing checkout (or an authorized worktree). Never main."
        files: [README.md]
      - id: architect
        agent: architect
        label: Architect
      - id: tower
        runtime: laptop
        label: Tower first
        description: "The tower that models the changed part gets the planned design, validated 0 errors / 0 warnings and committed before any code."
        files: [README.md]
      - id: signoff
        runtime: github
        type: human
        label: Plan sign-off
        description: "For a sensitive area or a large plan, the maintainer approves or revises the plan on the issue before any step runs."
        approval: { by: maintainer, via: issue comment, actions: [approve, edit, respond], when: "sensitive area or many steps" }
        files: [README.md]
      - id: tasks
        runtime: laptop
        label: Task files
        description: "tools/squad/tasks/<n>/NN-*.md, one or two items each: files to read, why with file:line, numbered changes, tests, and the Files: line the runner checks."
        prompt: task-template
        files: [task-template.md]
    edges:
      - "branch -> architect [spawn]: issue, tower"
      - "architect -> tower [data]: design"
      - { from: tower, to: signoff, kind: handoff, label: sensitive }
      - { from: tower, to: tasks, label: otherwise }
      - "signoff -> tasks: approved"
      - "signoff -> architect [return]: revise"

  # 3 ───────────────────────────────────────────────────────────────
  - id: specialists
    title: Specialists
    description: "Each role is one run.mjs process on its own OpenRouter model, with only the tools its role allows."
    nodes:
      - id: researcher
        agent: researcher
        label: Researcher
      - id: coder
        agent: coder
        label: Coder
      - id: tester
        agent: tester
        label: Tester
      - id: green
        runtime: laptop
        type: decision
        label: Step green?
        description: "steps.sh: the coder run finished, the project's check passes, every Files: entry was touched. Otherwise the step is RED and the chain stops."
        decision: { output: binary, candidates: [green, red], fail: closed }
        files: [roles/coder.md]
      - id: commit
        runtime: laptop
        label: Step commit
        description: "Only the step's own files, signed off, with a Squad-Cost trailer. Local edits from before the run are never staged; a rerun skips committed steps."
        files: [roles/coder.md]
      - id: doc_writer
        agent: doc-writer
        label: Doc writer
    edges:
      - "researcher -> coder [data]: cited answers"
      - "coder -> green [data]: report, Known gaps"
      - "green -> commit: green"
      - "green -> coder [return]: red, lead rewrites the step"
      - "commit -> tester [handoff]: branch"
      - "tester -> doc_writer: checks pass"

  # 4 ───────────────────────────────────────────────────────────────
  - id: quality
    title: Quality Gate
    description: "Reviewer and security answer in one request each with the code packed, started together. The merge gate reads their verdicts; the maintainer merges."
    nodes:
      - id: pack
        runtime: laptop
        label: Pack
        description: "pack.mjs: role rules, the brief (what is already decided), the diff against the base and the changed files, in one prompt; it records the reviewed commit."
        files: [roles/reviewer.md]
      - id: reviewer
        agent: reviewer
        label: Reviewer
      - id: security
        agent: security
        label: Security auditor
      - id: triage_findings
        runtime: laptop
        type: decision
        label: Findings real?
        description: "The lead checks each finding in the code or by running it; keeps the real ones as new steps, drops the rest with the reason on the issue."
        decision: { output: binary, candidates: [fix, drop], fail: closed }
        files: [README.md]
      - id: verifier
        agent: verifier
        label: Verifier
      - id: gate
        runtime: laptop
        type: decision
        label: Merge gate
        description: "gate.mjs: CI green, not a draft, reviewer and security approve the PR's exact head. READY or NOT READY with the reasons, and a note when a pass saw a pack trimmed to fit."
        decision: { output: binary, candidates: [ready, not_ready], fail: closed }
        files: [roles/reviewer.md, roles/security.md]
      - id: merge
        runtime: github
        type: human
        label: Maintainer merge
        description: "Only the maintainer merges. Agents never run the merge."
        approval: { by: maintainer, via: PR, actions: [approve, respond] }
    edges:
      - "pack -> reviewer [spawn]: packed review"
      - "pack -> security [spawn]: packed audit"
      - "reviewer -> triage_findings [return]: verdict JSON"
      - "security -> triage_findings [return]: verdict JSON"
      - "triage_findings -> verifier: nothing left to fix"
      - "verifier -> gate: PASS"
      - "gate -> merge: READY"

  # 5 ───────────────────────────────────────────────────────────────
  - id: runner
    title: Runner (tools/squad)
    description: "Node scripts with no dependency beyond Node 22 and git. Installed into the project by squad init; the same files in every harness."
    nodes:
      - id: run
        runtime: laptop
        type: process
        label: run.mjs
        description: "One role, one process: picks the model from squad.json, the mode (tool loop for most roles, oneshot or batch for reviewer and security), calls OpenRouter, records the cost."
        tower: towers/runner-loop.tower.yaml
        files: [towers/runner-loop.tower.yaml, roles/coder.md]
      - id: steps
        runtime: laptop
        type: process
        label: steps.sh
        description: "Runs the coder on each task file in order; check, Files: check and one commit per green step. Runs from a copy of itself. Every file of the folder is a coder step: tasks of other roles live in their own folder."
        files: [roles/coder.md]
      - id: guard
        runtime: laptop
        type: guard
        label: Write fence
        description: "Writes only inside the role's folders, real paths checked, symlinks followed; secrets and paths outside the repo refused. Children run without the API key."
        files: [roles/coder.md]
      - id: gate_script
        runtime: laptop
        type: process
        label: gate.mjs
        description: "Reads the two verdicts and the PR state; the reviewed commit must be the PR head."
        files: [roles/reviewer.md]
      - id: steward
        runtime: laptop
        type: process
        label: PR steward
        description: "prs.mjs: reviews and gates every open PR from the trusted checkout, one row per PR."
        files: [README.md]
    edges:
      - "steps -> run [spawn]: coder, one step"
      - "run -> guard [call]: every write"
      - "steward -> run [spawn]: reviewer, security"
      - "steward -> gate_script [call]: per PR"

  # 6 ───────────────────────────────────────────────────────────────
  - id: setup
    title: Setup & Config
    description: "Three commands and one key. No account other than OpenRouter's."
    nodes:
      - id: init
        runtime: laptop
        type: entry
        label: squad init
        description: "Copies the runner into tools/squad/, detects squad.json (check command, write and review folders), installs this tower and ignores the logs."
        files: [README.md]
      - id: key
        runtime: laptop
        type: memory
        label: OpenRouter key
        description: "flow-tower squad key stores it in the user folder (~/.config/flow-tower/.env, mode 600), never in the project. OPENROUTER_API_KEY in the environment wins."
        files: [README.md]
      - id: config
        runtime: laptop
        type: memory
        label: squad.json
        description: "Per project: check/test commands, write and review folders, the diff base, project rules and the model of each role. The runner runs commands without a shell, so a command with shell syntax is refused when loaded."
        files: [squad.example.json]
      - id: doctor
        runtime: laptop
        type: guard
        label: squad doctor
        description: "Checks git, Node, the config, the runner files and the key, with no paid call."
        files: [README.md]
      - id: skill
        runtime: laptop
        type: memory
        label: Squad skill
        description: "install-skill --target claude|codex|pi|hermes|cursor|agents: the lead's procedure, the same in every harness."
        files: [README.md]
    edges:
      - "init -> config [data]: detected"
      - "key -> doctor [data]: present?"
      - "config -> doctor [data]: valid?"

  # 7 ───────────────────────────────────────────────────────────────
  - id: observe
    title: Cost & Live View
    description: "Every run leaves a ledger line; the tower lights up while a role runs."
    nodes:
      - id: ledger
        runtime: laptop
        type: memory
        label: Cost ledger
        description: "One line per run in the user folder: role, model, steps, tokens, the cost OpenRouter reports. cost.mjs sums an issue."
        files: [README.md]
      - id: live
        runtime: laptop
        type: output
        label: Live tower
        description: "ev.sh posts start/end events to a running flow-tower viewer: the role's node lights up. Best effort: offline it is skipped."
        files: [README.md]
    edges:
      - "ledger -> live [data]: cost per role"

  # 8 ───────────────────────────────────────────────────────────────
  - id: models
    title: Models (OpenRouter)
    description: "One key, any family. The defaults come from the squad's own benchmarks; squad.json overrides any role."
    nodes:
      - id: openrouter
        runtime: openrouter
        type: model
        label: OpenRouter
        description: "One OpenAI-style endpoint. A role with no model of its own uses its family's: coder for writers and triage, reviewer for read-only graders."
        files: [squad.example.json]
      - id: haiku
        runtime: openrouter
        type: model
        label: Claude Haiku 5.5
        model: anthropic/claude-haiku-5.5
        description: "Default coder (and triage, tester, doc writer by family)."
        files: [squad.example.json]
      - id: glm
        runtime: openrouter
        type: model
        label: GLM 5.3 Flash
        model: z-ai/glm-5.3-flash
        description: "Default reviewer (and architect, researcher, verifier by family). Another family than the coder's."
        files: [squad.example.json]
      - id: deepseek
        runtime: openrouter
        type: model
        label: DeepSeek 4.1 Flash
        model: deepseek/deepseek-v4.1-flash
        description: "Default security auditor."
        files: [squad.example.json]
    edges:
      - "openrouter -> haiku [call]: write"
      - "openrouter -> glm [call]: judge"
      - "openrouter -> deepseek [call]: audit"

  # 9 ───────────────────────────────────────────────────────────────
  - id: autopilot
    title: Unattended Runner
    description: "#320: tools/squad/runner.mjs works labelled issues with no person in a session. The procedure lives in code; models make only the judgement calls. One issue at a time, on this laptop first, polling GitHub."
    nodes:
      - id: poll
        runtime: laptop
        type: entry
        label: Poll squad:go
        description: "Every 10 minutes (--once for one pass) it lists open issues labelled squad:go, oldest first."
        files: [README.md]
      - id: claim
        runtime: github
        label: Claim
        description: "Swaps squad:go for squad:running, so two runners never take the same issue."
        files: [README.md]
      - id: driver
        runtime: laptop
        type: process
        label: runner.mjs
        description: "The code-driven lead: triage, worktree under the user folder, plan as task files, steps.sh, review and security, lead-judge, at most 2 fix rounds (findings still open after them go into the draft PR; a security one not clearly medium or low stops), verifier, draft PR, gate. A failed check stops the issue. Issue and plan reach models fenced as data; anything posted is scrubbed of keys and tokens."
        files: [README.md]
      - id: judge
        agent: lead-judge
        label: Lead judge
        description: "Keeps or drops findings against the original issue and plan. A kept fix may name up to 5 supporting files it must edit; every Files path must be a concrete regular file outside secret paths, and CI or runner files need a person."
      - id: limits
        runtime: laptop
        type: guard
        label: Limits
        description: "From squad.json: issues in parallel (1), a dollar cap per issue summed from the ledger, a wall-clock timeout. Over a limit, the issue stops. A lock in the user folder allows one runner, and --issue n needs the squad:go label."
        limits: { concurrency: 1 }
        files: [squad.example.json]
      - id: draft_pr
        runtime: github
        type: output
        label: Draft PR
        description: "Stop point: a draft PR with the plan, the dropped findings with reasons and the spend, then the gate result commented on the issue, whose label becomes squad:review. The maintainer merges."
        files: [README.md]
      - id: failed
        runtime: github
        type: output
        label: squad:failed
        description: "Red chain, over budget, timeout or no verdict: a comment with the reason, label squad:failed, the worktree kept for inspection."
        files: [README.md]
    edges:
      - "poll -> claim: oldest issue"
      - "claim -> driver [handoff]: issue"
      - "driver -> limits [call]: before each stage"
      - "driver -> judge [spawn]: findings"
      - "judge -> driver [return]: keep / drop"
      - "driver -> draft_pr: gate result"
      - "driver -> failed: stop"
      - "limits -> failed: over a limit"

links:
  - "intake.route -> orchestration.branch [handoff]: full"
  - "intake.lead -> orchestration.architect [spawn]: plan"
  - "orchestration.tasks -> runner.steps [call]: run the folder"
  - "runner.steps -> specialists.coder [spawn]: step N"
  - "orchestration.architect -> specialists.researcher [spawn]: open questions"
  - "specialists.doc_writer -> quality.pack [handoff]: branch ready"
  - "quality.triage_findings -> orchestration.tasks [return]: fix steps"
  - "runner.run -> observe.ledger [data]: cost"
  - "runner.run -> observe.live [data]: events"
  - "runner.run -> models.openrouter [call]: chat completions"
  - "setup.key -> runner.run [data]: key"
  - "setup.config -> runner.run [data]: models, commands"
  - "setup.skill -> intake.lead [data]: procedure"
  - "quality.gate -> runner.gate_script [call]"
  - "quality.pack -> runner.run [spawn]: reviewer, security"
  - "autopilot.driver -> intake.triage [spawn]: issue text"
  - "autopilot.driver -> orchestration.architect [spawn]: plan"
  - "autopilot.driver -> runner.steps [call]: task folder"
  - "autopilot.driver -> quality.pack [call]: branch"
  - "autopilot.driver -> quality.verifier [spawn]: criteria"
  - "autopilot.driver -> quality.gate [call]: PR"
  - "autopilot.limits -> observe.ledger [data]: spend so far"
