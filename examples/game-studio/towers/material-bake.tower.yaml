# yaml-language-server: $schema=../../../schema/flow-tower.schema.json
version: 1
name: Material & bake
description: >-
  Inside one material-artist run: build the shader from style tokens, bake high-to-low,
  pack ORM, enforce the palette, compare against the concept and retry at most twice.
root: ..

agents:
  materials:
    from: .claude/agents/material-artist.md
    harness: { max_attempts: 2 }

layers:
  - id: setup
    title: Shader Setup
    description: Start from tokens, not taste. The palette and roughness ranges come from the style guide.
    nodes:
      - id: uv_mesh
        type: entry
        label: UV'd low poly
        description: Low-poly with packed UVs plus the high-poly bake source.
        files: [pipelines/blender/uv_unwrap.py]
      - id: tokens
        type: memory
        label: Style tokens
        description: Ember & slate palette, roughness bands per surface, emissive rules for beacons.
        files: [config/style-guide.json]
      - id: texel
        type: decision
        label: Texel density?
        description: Within 10% of the class target, otherwise back to the UV step.
        files: [config/asset-budgets.yaml]
      - id: graph
        agent: materials
        label: Shader graph
    edges:
      - "uv_mesh -> texel"
      - "texel -> graph: ok"
      - "tokens -> graph [data]: palette"

  - id: bake
    title: Bake & Paint
    description: Deterministic Cycles bakes through bpy, then procedural paint layers.
    nodes:
      - id: normal_ao
        label: Normal + AO
        description: Cage-based high-to-low bake, 16 samples AO, 2048 px for heroes.
        files: [pipelines/blender/bake_pbr.py]
      - id: curvature
        label: Curvature mask
        description: Drives edge wear and ember glow on worn edges.
        files: [pipelines/blender/bake_pbr.py]
      - id: albedo
        label: Albedo paint
        description: Painterly gradients and hand-placed grime masks over the base palette.
      - id: orm
        label: ORM pack
        description: Occlusion, roughness, metallic packed into one texture (R, G, B).
        files: [pipelines/blender/bake_pbr.py]
      - id: palette
        type: guard
        label: Palette check
        description: Rejects albedo values outside the palette Delta-E tolerance and pure black or white.
        files: [config/style-guide.json]
    edges:
      - "normal_ao -> curvature [data]: AO"
      - "curvature -> albedo [data]: masks"
      - "albedo -> palette [call]: sample"
      - "palette -> orm: in palette"

  - id: check
    title: Compare & Return
    description: Look at it the way the art director will, before the art director does.
    nodes:
      - id: preview
        type: tool
        label: Lookdev shot
        description: Viewport render under the three standard lighting rigs.
        tools: [mcp__blender__get_viewport_screenshot]
      - id: matches
        type: decision
        label: Matches concept?
        description: Side-by-side with the locked concept. Max 2 attempts, then return with notes.
      - id: textures
        type: output
        label: PBR set
        description: T_<Asset>_BC, T_<Asset>_N, T_<Asset>_ORM at class resolution.
      - id: model
        type: model
        label: Sonnet 5.5
        model: claude-sonnet-5-5
        description: Material artist model. Vision input for the lookdev comparison.
    edges:
      - "preview -> matches [data]: renders"
      - "matches -> textures: yes"
      - "matches -> model [call]: compare"

links:
  - "setup.graph -> bake.normal_ao [call]: bake"
  - "bake.orm -> check.preview: textures"
  - "check.matches -> setup.graph [return]: retry"
  - "bake.palette -> bake.albedo [return]: off palette"
  - "setup.texel -> check.textures [return]: bad UVs"
