# Creative variants for campaign C1 "Stop re-keying". Generated by the Ad creative agent,
# checked by the policy guard, claims reviewed by legal (2026-10-08).
campaign: C1
pillar: no-more-rekeying

google_rsa:                       # responsive search ad: up to 15 headlines (30 chars), 4 descriptions (90)
  ad_group: invoice-capture-de
  final_url: https://tallymoor.example/de/rechnungseingang-automatisieren
  headlines:
    - { text: "Rechnungen ohne Abtippen", pin: 1 }
    - { text: "Eingangsrechnungen in SAP" }
    - { text: "97 % Feldgenauigkeit", claim: C-001 }
    - { text: "XRechnung und ZUGFeRD", claim: C-004 }
    - { text: "Freigaben in 3 statt 9 Tagen", claim: C-002 }
    - { text: "Demo mit Ihren Rechnungen" }
    - { text: "Hosting nur in der EU", claim: C-008 }
  descriptions:
    - { text: "Kopf- und Positionsdaten aus PDF und E-Rechnung, direkt gebucht in SAP oder Dynamics." }
    - { text: "Jede Rechnung hat einen Freigeber und eine Frist. Prüfpfad für den Abschluss.", claim: C-006 }
  tests: "Does an accuracy claim beat a time-saved claim in headline position 2?"
  status: approved

linkedin_single_image:
  - id: li-c1-v1
    intro: "Your AP team still re-keys PDFs into SAP? Tallymoor reads header and line items with 97 % field accuracy and posts them for approval."
    headline: "Stop re-keying supplier invoices"
    cta: REQUEST_DEMO
    claim: C-001
    image: { prompt: "Product UI screenshot: invoice with extracted fields highlighted", ai_generated: false }
    tests: "accuracy angle"
    status: approved
  - id: li-c1-v2
    intro: "Approvals stuck in someone's inbox? Customers cut median approval time from 9 to 3 days."
    headline: "Invoice approvals that move"
    cta: REQUEST_DEMO
    claim: C-002
    image: { prompt: "Abstract: three envelopes moving along a line to a check mark, brand colours", ai_generated: true, label: "Made with AI" }
    tests: "time-saved angle"
    status: approved
  - id: li-c1-v3
    intro: "The fastest AP automation in Europe."
    headline: "Try Tallymoor"
    claim: C-007
    status: rejected
    rejected_reason: "C-007 is a rejected claim (unproven superlative)."

meta_retargeting:
  - id: m-c1-v1
    primary_text: "You looked at invoice capture. See it on your own supplier invoices in 20 minutes."
    headline: "Demo with your invoices"
    description: "SAP, Dynamics, Exact"
    image: { prompt: "Product UI, invoice list with status chips", ai_generated: false }
    audience: site visitors 30d, consented (ad_personalization granted)
    tests: "personal demo offer vs generic demo"
    status: approved
